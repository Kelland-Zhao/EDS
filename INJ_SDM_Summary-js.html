<script>
  const swalTitle = (cn, en) => `${cn}<span style="display:block;font-size:0.65em;color:#888;font-weight:400;line-height:1.3;margin-top:4px;">${en}</span>`;
  const swalHtml = (cn, en) => `<div>${cn}<div style="font-size:0.85em;color:#888;margin-top:6px;line-height:1.4;">${en}</div></div>`;

  $(document).ready(function () {
    const userName = sessionStorage.getItem('Name') || '';
    const userEmail = sessionStorage.getItem('Email') || '';
    let scUsers = [];
    let historyRecords = [];
    let historyCommItems = [];
    let historyItemIds = new Set();
    let historyTodoItems = [];
    let historyTodoItemIds = new Set();
    let editingReportId = '';
    let commActionLock = false;
    let showClosedFilter = false;
    let showTodoClosedFilter = false;

    $('#name').text(userName);

    const pad = n => String(n).padStart(2, '0');
    const formatLocalDate = date => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);

    function showLoading(cn, en) {
      Swal.fire({
        title: swalTitle(cn, en),
        allowOutsideClick: false,
        showConfirmButton: false,
        didOpen: () => Swal.showLoading()
      });
    }

    function showError(cn, en) {
      Swal.fire({ icon: 'error', title: swalTitle('错误', 'Error'), html: swalHtml(cn, en) });
    }

    function showSuccess(cn, en) {
      Swal.fire({ icon: 'success', title: swalTitle('成功', 'Success'), html: swalHtml(cn, en), timer: 1500, showConfirmButton: false });
    }

    function parseResponse(raw) {
      return typeof raw === 'string' ? JSON.parse(raw) : raw;
    }

    function cardFor(type) {
      if (type === 'major') return $('#MajorCard');
      if (type === 'outstanding') return $('#OutstandingCard');
      if (type === 'todo') return $('#TodoCard');
      return $('#CommunicationCard');
    }

    function updateCounts() {
      $('.issue-card').each(function () {
        $(this).find('.count-badge').text($(this).find('.item-row').length);
        $(this).find('.item-num').each(function (index) { $(this).text(index + 1); });
      });
      updateCommBatchToolbar();
      updateTodoBatchToolbar();
    }

    function workshopChoice(name, selected) {
      return `<div class="workshop-choice" role="radiogroup" aria-label="车间 / Workshop">
        <input type="radio" id="${name}-tb1" name="${name}" value="TB1" ${selected === 'TB1' ? 'checked' : ''}><label for="${name}-tb1">TB1</label>
        <input type="radio" id="${name}-tb2" name="${name}" value="TB2" ${selected === 'TB2' ? 'checked' : ''}><label for="${name}-tb2">TB2</label>
      </div>`;
    }

    function ownerChoice(name, selectedOwners) {
      const selected = Array.isArray(selectedOwners) ? selectedOwners : [];
      return `<div class="owner-choice" role="group" aria-label="责任人 / Owners">${scUsers.map((user, index) => {
        const id = `${name}-owner-${index}`;
        return `<input type="checkbox" id="${id}" value="${$('<div>').text(user.name).html()}" ${selected.includes(user.name) ? 'checked' : ''}><label for="${id}">${$('<div>').text(user.name).html()}</label>`;
      }).join('')}</div>`;
    }

    function addIssueRow(type, data) {
      const item = data || {};
      const name = `${type}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const workshop = Object.prototype.hasOwnProperty.call(item, 'workshop') ? item.workshop : 'TB1';
      const row = $(`<div class="item-row" data-type="${type}">
        <span class="drag-handle" title="拖动排序 / Drag to reorder">⋮⋮</span>
        <span class="item-num"></span>
        ${workshopChoice(name, workshop)}
        <input class="form-control machine-no" placeholder="机台号 / Machine No." value="${$('<div>').text(item.machineNo || '').html()}">
        <textarea class="form-control description" rows="2" placeholder="问题描述 / Description">${$('<div>').text(item.description || '').html()}</textarea>
        <button type="button" class="delete-item" title="删除 / Delete">×</button>
      </div>`);
      cardFor(type).find('.item-list').append(row);
      updateCounts();
    }

    function addCommunicationRow(data) {
      const item = data || {};
      const name = `communication-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const status = item.itemStatus || '';
      var statusHtml = '';
      var statusClass = '';
      var actionsHtml = '';
      if (status === 'CLOSED') {
        statusClass = 'comm-closed';
        statusHtml = '<span class="comm-status-label">✓ 已关闭<br><small>Closed</small></span>';
        actionsHtml = `<button class="btn btn-sm btn-outline-secondary reopen-comm-item" data-id="${item.itemId || ''}" title="重新打开 / Reopen">↩ 重开<br><small>Reopen</small></button>`;
      } else {
        actionsHtml = `<button class="btn btn-sm btn-outline-success close-comm-item" data-id="${item.itemId || ''}" title="关闭 / Close">✓ 关闭<br><small>Close</small></button>`;
      }
      var actionsCol = `<div class="comm-actions-wrapper-cell">${statusHtml}<div class="comm-actions">${actionsHtml}</div></div>`;
      var disabledAttr = status === 'CLOSED' ? ' disabled' : '';
      const row = $(`<div class="item-row communication ${statusClass}" data-type="communication" data-item-id="${item.itemId || ''}">
        <input type="checkbox" class="comm-checkbox"${disabledAttr}>
        <span class="drag-handle" title="拖动排序 / Drag to reorder">⋮⋮</span>
        <span class="item-num"></span>
        <textarea class="form-control description" rows="2" placeholder="沟通事项 / Communication" ${status === 'CLOSED' ? 'disabled' : ''}>${$('<div>').text(item.description || '').html()}</textarea>
        ${ownerChoice(name, item.owners || [])}
        ${actionsCol}
        <button type="button" class="delete-item" title="删除 / Delete">×</button>
        <div class="attachments-area">${renderAttachments(item.attachments || [])}<button class="btn btn-sm btn-outline-secondary btn-attach pick-attachment" type="button" title="添加附件 / Attach File"><i class="bi bi-paperclip"></i></button></div>
      </div>`);
      if (status === 'CLOSED') {
        row.find('.owner-choice input').prop('disabled', true);
        row.find('.btn-attach').prop('disabled', true);
      }
      $('#CommunicationCard .item-list').append(row);
      updateCounts();
    }

    function addTodoRow(data) {
      const item = data || {};
      const name = `todo-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const status = item.itemStatus || '';
      var statusHtml = '';
      var statusClass = '';
      var actionsHtml = '';
      if (status === 'CLOSED') {
        statusClass = 'comm-closed';
        statusHtml = '<span class="comm-status-label">✓ 已完成<br><small>Done</small></span>';
        actionsHtml = `<button class="btn btn-sm btn-outline-secondary reopen-comm-item" data-id="${item.itemId || ''}" title="重开 / Reopen">↩ 重开<br><small>Reopen</small></button>`;
      } else {
        actionsHtml = `<button class="btn btn-sm btn-outline-success close-comm-item" data-id="${item.itemId || ''}" title="关闭 / Close">✓ 关闭<br><small>Close</small></button>`;
      }
      var actionsCol = `<div class="comm-actions-wrapper-cell">${statusHtml}<div class="comm-actions">${actionsHtml}</div></div>`;
      var disabledAttr = status === 'CLOSED' ? ' disabled' : '';
      const row = $(`<div class="item-row todo ${statusClass}" data-type="todo" data-item-id="${item.itemId || ''}">
        <input type="checkbox" class="comm-checkbox"${disabledAttr}>
        <span class="drag-handle" title="拖动排序 / Drag to reorder">⋮⋮</span>
        <span class="item-num"></span>
        <textarea class="form-control description" rows="2" placeholder="待办事项 / To-Do" ${status === 'CLOSED' ? 'disabled' : ''}>${$('<div>').text(item.description || '').html()}</textarea>
        ${actionsCol}
        <button type="button" class="delete-item" title="删除 / Delete">×</button>
        <div class="attachments-area">${renderAttachments(item.attachments || [])}<button class="btn btn-sm btn-outline-secondary btn-attach pick-attachment" type="button" title="添加附件 / Attach File"><i class="bi bi-paperclip"></i></button></div>
      </div>`);
      if (status === 'CLOSED') {
        row.find('.btn-attach').prop('disabled', true);
      }
      $('#TodoCard .item-list').append(row);
      updateCounts();
    }

    function resetForm() {
      editingReportId = '';
      $('#ReportDate').val(formatLocalDate(today));
      $('#DataStartDate,#DataEndDate').val(formatLocalDate(yesterday));
      $('.item-list').empty();
      addIssueRow('major', {});
      addIssueRow('outstanding', {});
      addCommunicationRow({});
      addTodoRow({});
      $('#CancelEdit').addClass('d-none');
      $('#SaveReport').html('<i class="bi bi-save"></i> 保存 / Save');
      clearValidation();
    }

    function reloadTodayReport() {
      showLoading('刷新数据中...', 'Refreshing Data...');
      var reportDate = $('#ReportDate').val();
      google.script.run
        .withSuccessHandler(raw => {
          Swal.close();
          const result = parseResponse(raw);
          historyCommItems = result.historyCommItems || [];
          historyItemIds = new Set(historyCommItems.map(function (item) { return item.itemId; }).filter(Boolean));
          historyTodoItems = result.historyTodoItems || [];
          historyTodoItemIds = new Set(historyTodoItems.map(function (item) { return item.itemId; }).filter(Boolean));
          if (!result.success || !result.todayReport) {
            var selectedDate = $('#ReportDate').val();
            resetForm();
            $('#ReportDate').val(selectedDate);
            if (historyCommItems.length) {
              $('#CommunicationCard .item-list').append('<div class="history-divider"><span>历史跟进事项 / Historical Follow-Up</span></div>');
              historyCommItems.forEach(item => addCommunicationRow(item));
            }
            if (historyTodoItems.length) {
              $('#TodoCard .item-list').append('<div class="history-divider"><span>历史待办 / Historical To-Do</span></div>');
              historyTodoItems.forEach(item => addTodoRow(item));
            }
            return;
          }
          populateForm(result.todayReport);
        })
        .withFailureHandler(() => { Swal.close(); resetForm(); })
        .getINJSDMInitData(userName, userEmail, reportDate, showClosedFilter || showTodoClosedFilter);
    }

    function populateForm(report) {
      editingReportId = report.reportId;
      $('#ReportDate').val(report.reportDate);
      $('#DataStartDate').val(report.dataStartDate);
      $('#DataEndDate').val(report.dataEndDate);
      $('.item-list').empty();
      (report.major.length ? report.major : [{}]).forEach(item => addIssueRow('major', item));
      (report.outstanding.length ? report.outstanding : [{}]).forEach(item => addIssueRow('outstanding', item));
      (report.communication.length ? report.communication : [{}]).forEach(item => addCommunicationRow(item));
      (report.todo.length ? report.todo : [{}]).forEach(item => addTodoRow(item));
      // Historical carry-over items
      if (historyCommItems.length) {
        $('#CommunicationCard .item-list').append('<div class="history-divider"><span>历史跟进事项 / Historical Follow-Up</span></div>');
        historyCommItems.forEach(item => addCommunicationRow(item));
      }
      if (historyTodoItems.length) {
        $('#TodoCard .item-list').append('<div class="history-divider"><span>历史待办 / Historical To-Do</span></div>');
        historyTodoItems.forEach(item => addTodoRow(item));
      }
      $('#CancelEdit').removeClass('d-none');
      $('#SaveReport').html('<i class="bi bi-save"></i> 更新 / Update');
      clearValidation();
    }

    function expectedWorkshop(machineNo) {
      const machine = String(machineNo || '').trim().toUpperCase();
      if (/^(E0|H1|V1|S1)/.test(machine)) return 'TB1';
      if (/^(H2|V2)/.test(machine)) return 'TB2';
      return '';
    }

    function clearValidation() {
      $('.invalid-field').removeClass('invalid-field');
      $('.invalid-choice').removeClass('invalid-choice');
      $('#ValidationSummary').removeClass('show').empty();
    }

    function collectAndValidate() {
      clearValidation();
      const errors = [];
      const payload = {
        reportId: editingReportId,
        reportDate: $('#ReportDate').val(),
        dataStartDate: $('#DataStartDate').val(),
        dataEndDate: $('#DataEndDate').val(),
        major: [],
        outstanding: [],
        communication: [],
        todo: []
      };
      const mark = (element, message, choice) => {
        $(element).addClass(choice ? 'invalid-choice' : 'invalid-field');
        errors.push(message);
      };

      if (!payload.dataStartDate) mark('#DataStartDate', '请选择数据开始日期');
      if (!payload.dataEndDate) mark('#DataEndDate', '请选择数据结束日期');
      if (payload.dataStartDate && payload.dataEndDate && payload.dataStartDate > payload.dataEndDate) {
        mark('#DataStartDate', '数据开始日期不能晚于结束日期');
        $('#DataEndDate').addClass('invalid-field');
      }
      if (payload.dataEndDate && payload.reportDate && payload.dataEndDate > payload.reportDate) {
        mark('#DataEndDate', '数据日期不能晚于填报日期');
      }

      ['major', 'outstanding'].forEach(type => {
        const title = type === 'major' ? '大故障/大问题' : '今日遗留问题';
        cardFor(type).find('.item-row').each(function (index) {
          const workshop = $(this).find('.workshop-choice input:checked').val() || '';
          const machineNo = $(this).find('.machine-no').val().trim().toUpperCase();
          const description = $(this).find('.description').val().trim();
          if (!machineNo && !description) return;
          if (!workshop) mark($(this).find('.workshop-choice'), `${title}第 ${index + 1} 条请选择车间`, true);
          if (!machineNo) mark($(this).find('.machine-no'), `${title}第 ${index + 1} 条缺少机台号`);
          if (!description) mark($(this).find('.description'), `${title}第 ${index + 1} 条缺少问题描述`);
          const expected = expectedWorkshop(machineNo);
          if (expected && workshop && expected !== workshop) {
            mark($(this).find('.workshop-choice'), `${title}第 ${index + 1} 条机台号应属于 ${expected}`, true);
          }
          if (workshop && machineNo && description) payload[type].push({ workshop, machineNo, description });
        });
      });

      $('#CommunicationCard .item-row').each(function (index) {
        const description = $(this).find('.description').val().trim();
        const owners = $(this).find('.owner-choice input:checked').map(function () { return this.value; }).get();
        const isClosed = $(this).hasClass('comm-closed');
        const rowItemId = $(this).data('item-id') || '';
        const isHistoryItem = historyItemIds.has(rowItemId);
        if (!description && !owners.length) return;
        if (isClosed) return; // Closed items not included in save
        if (isHistoryItem) return; // Historical items (incl. follow-up) handled individually, not re-saved
        if (!description) mark($(this).find('.description'), `沟通事项第 ${index + 1} 条缺少事项内容`);
        if (!owners.length) mark($(this).find('.owner-choice'), `沟通事项第 ${index + 1} 条请选择责任人`, true);
        var commAtts = []; $(this).find('.attach-chip').each(function () { var a = $(this).find('a'); if (a.length) commAtts.push({ id: a.attr('href').match(/\/d\/(.+)\//)?.[1] || '', name: a.text().replace(/^📄 /,''), url: a.attr('href') }); });
        if (description && owners.length) payload.communication.push({ description, owners, attachments: commAtts });
      });

      $('#TodoCard .item-row').each(function (index) {
        const description = $(this).find('.description').val().trim();
        const isClosed = $(this).hasClass('comm-closed');
        const rowItemId = $(this).data('item-id') || '';
        const isHistoryItem = historyTodoItemIds.has(rowItemId);
        if (!description) return;
        if (isClosed) return;
        if (isHistoryItem) return;
        var todoAtts = []; $(this).find('.attach-chip').each(function () { var a = $(this).find('a'); if (a.length) todoAtts.push({ id: a.attr('href').match(/\/d\/(.+)\//)?.[1] || '', name: a.text().replace(/^📄 /,''), url: a.attr('href') }); });
        payload.todo.push({ description, attachments: todoAtts });
      });

      if (!payload.major.length && !payload.outstanding.length && !payload.communication.length && !payload.todo.length) {
        errors.push('请至少填写一条完整事项');
      }
      if (errors.length) {
        $('#ValidationSummary').addClass('show').html(`<strong>请检查以下内容 / Please check:</strong><br>${[...new Set(errors)].map(x => `• ${x}`).join('<br>')}`);
        document.getElementById('ValidationSummary').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return null;
      }
      return payload;
    }

    function parseBulk(text) {
      const parsed = [], invalid = [];
      String(text || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean).forEach(line => {
        const match = line.match(/^([A-Za-z0-9_]+)(?:\s*[-:：]\s*|\s+)(.+)$/);
        if (!match) { invalid.push(line); return; }
        const machineNo = match[1].toUpperCase();
        parsed.push({ machineNo, description: match[2].trim(), workshop: expectedWorkshop(machineNo) });
      });
      return { parsed, invalid };
    }

    function dataDateText(report) {
      return report.dataStartDate === report.dataEndDate ? report.dataStartDate : `${report.dataStartDate} ～ ${report.dataEndDate}`;
    }

    function renderHistory(records) {
      const tbody = $('#HistoryTable tbody').empty();
      if (!records.length) {
        tbody.append('<tr><td colspan="6" class="text-muted py-4">没有符合条件的记录 / No matching records</td></tr>');
        return;
      }
      records.forEach(report => {
        tbody.append(`<tr>
          <td>${report.reportDate}</td><td>${dataDateText(report)}</td>
          <td>${report.major.length} 条</td><td>${report.outstanding.length} 条</td><td>${report.communication.length} 条</td>
          <td><div class="d-flex gap-1 flex-wrap justify-content-center">
            <button class="btn btn-outline-primary btn-sm view-report" data-id="${report.reportId}">查看<br><small>View</small></button>
            <button class="btn btn-primary btn-sm edit-report" data-id="${report.reportId}">编辑<br><small>Edit</small></button>
            <button class="btn btn-danger btn-sm delete-report" data-id="${report.reportId}">删除<br><small>Delete</small></button>
          </div></td>
        </tr>`);
      });
    }

    function renderDetail(report) {
      const issueList = items => items.length ? `<ol>${[...items].sort((a, b) => (a.workshop || '').localeCompare(b.workshop || '')).map(item => `<li><strong>${item.workshop} - ${item.machineNo}</strong> ${$('<div>').text(item.description).html()}</li>`).join('')}</ol>` : '<div class="text-muted">无 / None</div>';
      const communicationList = report.communication.length ? `<ol>${report.communication.map(item => `<li>${$('<div>').text(item.description).html()} <span class="text-muted">（责任人：${item.owners.join('、')}）</span></li>`).join('')}</ol>` : '<div class="text-muted">无 / None</div>';
      $('#DetailBody').html(`
        <div class="bg-light rounded p-2"><strong>填报日期：</strong>${report.reportDate}　<strong>数据日期：</strong>${dataDateText(report)}<br><small class="text-muted">最后修改：${report.updatedAt || '-'}</small></div>
        <div class="detail-block detail-major"><h6>大故障 / 大问题 <small class="text-muted" style="font-weight:400;">Major Failures / Major Issues</small></h6>${issueList(report.major)}</div>
        <div class="detail-block detail-outstanding"><h6>今日遗留问题 <small class="text-muted" style="font-weight:400;">Outstanding Issues</small></h6>${issueList(report.outstanding)}</div>
        <div class="detail-block detail-communication"><h6>SDM / Team 沟通事项 <small class="text-muted" style="font-weight:400;">SDM / Team Communication</small></h6>${communicationList}</div>`);
      bootstrap.Modal.getOrCreateInstance(document.getElementById('DetailModal')).show();
    }

    function loadHistory() {
      showLoading('加载历史记录中...', 'Loading History...');
      google.script.run
        .withSuccessHandler(raw => {
          Swal.close();
          const result = parseResponse(raw);
          if (!result.success) return showError(result.message || '加载失败', 'Failed to load history.');
          historyRecords = result.records || [];
          renderHistory(historyRecords);
        })
        .withFailureHandler(error => { Swal.close(); showError(error.message || String(error), 'Failed to load history.'); })
        .getINJSDMHistory('', '', userName, userEmail);
    }

    function actionLockRow(row) {
      commActionLock = true;
      row.find('.comm-actions button').prop('disabled', true);
      $('.comm-actions button').not(row.find('.comm-actions button')).prop('disabled', true);
      // Show blocking loading modal
      Swal.fire({
        title: swalTitle('处理中...', 'Processing...'),
        html: swalHtml('请稍候，正在提交。', 'Please wait, submitting.'),
        allowOutsideClick: false,
        showConfirmButton: false,
        didOpen: function () { Swal.showLoading(); }
      });
    }
    function actionUnlock() {
      commActionLock = false;
      $('.comm-actions button').prop('disabled', false);
      Swal.close();
    }
    function activeView(itemId) { return `<div class="comm-actions"><button class="btn btn-sm btn-outline-success close-comm-item" data-id="${itemId}" title="关闭 / Close">✓ 关闭<br><small>Close</small></button></div>`; }
    function renderAttachments(attachments) {
      if (!attachments || !attachments.length) return '';
      return attachments.map(function (a, idx) {
        return '<span class="attach-chip"><a href="' + a.url + '" target="_blank" title="' + $('<div>').text(a.name).html() + '">📄 ' + $('<div>').text(a.name).html() + '</a><span class="remove-attach" data-idx="' + idx + '" title="移除 / Remove">×</span></span>';
      }).join('');
    }
    $(document).on('click', '.remove-attach', function (e) {
      e.preventDefault();
      e.stopPropagation();
      $(this).closest('.attach-chip').remove();
    });
    // Google Picker setup
    var pickerApiLoaded = false;
    var oauthToken = '';
    function loadGooglePicker() {
      if (pickerApiLoaded) return;
      gapi.load('picker', { callback: function () { pickerApiLoaded = true; }, onerror: function () { console.log('Picker load failed'); } });
    }
    // Load picker API
    var pickerScript = document.createElement('script');
    pickerScript.src = 'https://apis.google.com/js/api.js';
    pickerScript.onload = loadGooglePicker;
    document.head.appendChild(pickerScript);

    $(document).on('click', '.pick-attachment', function () {
      var btn = $(this);
      var row = btn.closest('.item-row');
      if (!pickerApiLoaded) { Swal.fire({ icon:'warning', title:swalTitle('加载中','Loading'), html:swalHtml('Google Picker 正在加载，请稍后再试。','Google Picker is still loading. Please try again.'), timer:2000, showConfirmButton:false }); return; }
      google.script.run
        .withSuccessHandler(function (raw) {
          var r = parseResponse(raw);
          if (!r.success || !r.token) { showError('获取授权失败','Failed to get OAuth token'); return; }
          oauthToken = r.token;
          var picker = new google.picker.PickerBuilder()
            .addView(new google.picker.DocsView().setIncludeFolders(true))
            .setOAuthToken(oauthToken)
            .setDeveloperKey('AIzaSyC__PLACEHOLDER__KEY')
            .setAppId('PLACEHOLDER_PROJECT_NUMBER')
            .setCallback(function (data) {
              if (data.action === google.picker.Action.PICKED) {
                var doc = data.docs[0];
                var attach = { id: doc.id, name: doc.name, url: doc.url };
                var area = row.find('.attachments-area');
                var newChip = $('<span class="attach-chip"><a href="' + doc.url + '" target="_blank">📄 ' + $('<div>').text(doc.name).html() + '</a><span class="remove-attach" title="移除 / Remove">×</span></span>');
                area.find('.btn-attach').before(newChip);
              }
            })
            .build();
          picker.setVisible(true);
        })
        .getOAuthToken();
    });
    $(document).on('click', '.add-item', function () {
      const type = $(this).data('type');
      type === 'communication' ? addCommunicationRow({}) : type === 'todo' ? addTodoRow({}) : addIssueRow(type, {});
    });
    $(document).on('click', '.delete-item', function () { $(this).closest('.item-row').remove(); updateCounts(); });
    $(document).on('click', '.close-comm-item', function () {
      if (commActionLock) { Swal.fire({ icon:'warning', title:swalTitle('请稍候','Please Wait'), html:swalHtml('上一操作仍在处理中，请稍后再试。','Previous action is still in progress. Please wait.'), timer:2000, showConfirmButton:false }); return; }
      const row = $(this).closest('.item-row');
      const itemId = row.data('item-id') || $(this).data('id');
      const desc = row.find('.description').val().trim() || '(空)';
      Swal.fire({
        icon:'question', title:swalTitle('确认关闭','Confirm Close'),
        html:swalHtml(`确认关闭此沟通事项？<br>「${$('<div>').text(desc).html()}」<br>关闭后不再跨天带出。`, `Close this communication item? It will no longer be carried forward.`),
        showCancelButton:true, confirmButtonText:'确认 / Confirm', cancelButtonText:'取消 / Cancel'
      }).then(result => {
        if (!result.isConfirmed) return;
        if (!itemId) { row.remove(); updateCounts(); return; }
        actionLockRow(row);
        google.script.run
          .withSuccessHandler(raw => {
            actionUnlock();
            const r = parseResponse(raw);
            if (r.success) {
              // Reload from server to confirm the item is actually closed
              row.remove();
              updateCounts();
              reloadTodayReport();
            } else { showError(r.message || '操作失败', 'Operation failed'); row.find('.comm-actions-wrapper-cell').html(activeView(itemId)); }
          })
          .withFailureHandler(err => { actionUnlock(); showError(err.message || String(err), 'Operation failed'); row.find('.comm-actions-wrapper-cell').html(activeView(itemId)); })
          .closeINJSDMItem(itemId, userName, userEmail);
      });
    });
    $(document).on('click', '.reopen-comm-item', function () {
      if (commActionLock) { Swal.fire({ icon:'warning', title:swalTitle('请稍候','Please Wait'), html:swalHtml('上一操作仍在处理中，请稍后再试。','Previous action is still in progress. Please wait.'), timer:2000, showConfirmButton:false }); return; }
      const row = $(this).closest('.item-row');
      const itemId = row.data('item-id') || $(this).data('id');
      Swal.fire({
        icon:'question', title:swalTitle('确认重新打开','Confirm Reopen'),
        html:swalHtml('确认重新打开此沟通事项？<br>该事项将恢复为活跃状态。', 'Reopen this communication item? It will be restored to active status.'),
        showCancelButton:true, confirmButtonText:'确认 / Confirm', cancelButtonText:'取消 / Cancel'
      }).then(result => {
        if (!result.isConfirmed) return;
        if (!itemId) { row.removeClass('comm-closed').find('.comm-actions-wrapper-cell').html(activeView('')); row.find('.description,.owner-choice input,.comm-checkbox').prop('disabled', false); return; }
        actionLockRow(row);
        google.script.run
          .withSuccessHandler(raw => {
            actionUnlock();
            const r = parseResponse(raw);
            if (r.success) {
              row.removeClass('comm-closed').find('.comm-actions-wrapper-cell').html(activeView(itemId));
              row.find('.description,.owner-choice input,.comm-checkbox').prop('disabled', false);
            } else { showError(r.message || '操作失败', 'Operation failed'); }
          })
          .withFailureHandler(err => { actionUnlock(); showError(err.message || String(err), 'Operation failed'); })
          .reopenINJSDMItem(itemId, userName, userEmail);
      });
    });
    // ---- Batch selection for communication items ----
    function updateCommBatchToolbar() {
      var checked = $('#CommunicationCard .comm-checkbox:checked').length;
      var total = $('#CommunicationCard .comm-checkbox').length;
      var hasSelection = checked > 0;
      $('#CommBatchToolbar').find('.batch-count').text('已选 ' + checked + ' / ' + total + ' 项  Selected');
      $('#CommBatchToolbar').find('.batch-close-comm').prop('disabled', !hasSelection);
      $('#CommSelectAll').prop('indeterminate', hasSelection && checked < total);
      $('#CommSelectAll').prop('checked', checked === total && total > 0);
    }
    $(document).on('change', '#CommShowClosed', function () {
      showClosedFilter = this.checked;
      reloadTodayReport();
    });
    $(document).on('change', '#CommSelectAll', function () {
      var checked = this.checked;
      $('#CommunicationCard .comm-checkbox:not(:disabled)').prop('checked', checked);
      updateCommBatchToolbar();
    });
    $(document).on('change', '#CommunicationCard .comm-checkbox', function () {
      updateCommBatchToolbar();
    });
    function execBatchClose(itemIds) {
      commActionLock = true;
      $('#CommBatchToolbar button').prop('disabled', true);
      $('#CommunicationCard .comm-checkbox, #CommSelectAll').prop('disabled', true);
      Swal.fire({
        title: swalTitle('批量关闭中...', 'Batch Closing...'),
        html: swalHtml('正在处理 ' + itemIds.length + ' 条沟通事项，请稍候。', 'Processing ' + itemIds.length + ' items, please wait.'),
        allowOutsideClick: false,
        showConfirmButton: false,
        didOpen: function () { Swal.showLoading(); }
      });
      google.script.run
        .withSuccessHandler(raw => {
          Swal.close();
          commActionLock = false;
          updateCommBatchToolbar();
          $('#CommBatchToolbar button').prop('disabled', false);
          $('#CommunicationCard .comm-checkbox, #CommSelectAll').prop('disabled', false);
          var r = parseResponse(raw);
          if (r.success) {
            showSuccess('已关闭 ' + r.updated + ' 条。', r.updated + ' items closed.');
            reloadTodayReport();
          } else {
            showError(r.message || '操作失败', 'Operation failed');
          }
        })
        .withFailureHandler(err => {
          Swal.close();
          commActionLock = false;
          updateCommBatchToolbar();
          $('#CommBatchToolbar button').prop('disabled', false);
          $('#CommunicationCard .comm-checkbox, #CommSelectAll').prop('disabled', false);
          showError(err.message || String(err), 'Operation failed');
        })
        .batchUpdateINJSDMItems(JSON.stringify(itemIds), 'CLOSED', userName, userEmail);
    }
    $(document).on('click', '.batch-close-comm', function () {
      var checked = $('#CommunicationCard .comm-checkbox:checked');
      if (!checked.length) return;
      if (commActionLock) { Swal.fire({ icon:'warning', title:swalTitle('请稍候','Please Wait'), html:swalHtml('上一操作仍在处理中，请稍后再试。','Previous action is still in progress. Please wait.'), timer:2000, showConfirmButton:false }); return; }
      var itemIds = checked.closest('.item-row').map(function () { return $(this).data('item-id'); }).get().filter(Boolean);
      if (!itemIds.length) { showError('所选项目缺少 ID，请先保存后再操作。', 'Selected items need to be saved first.'); return; }
      Swal.fire({
        icon:'question', title:swalTitle('批量关闭','Batch Close'),
        html:swalHtml(`确认关闭选中的 ${itemIds.length} 条沟通事项？<br>关闭后不再跨天带出。`, `Close ${itemIds.length} selected items? They will no longer be carried forward.`),
        showCancelButton:true, confirmButtonText:'确认 / Confirm', cancelButtonText:'取消 / Cancel'
      }).then(result => {
        if (!result.isConfirmed) return;
        execBatchClose(itemIds);
      });
    });
    // ---- Batch selection for todo items ----
    function updateTodoBatchToolbar() {
      var checked = $('#TodoCard .comm-checkbox:checked').length;
      var total = $('#TodoCard .comm-checkbox').length;
      var hasSelection = checked > 0;
      $('#TodoBatchToolbar').find('.batch-count').text('已选 ' + checked + ' / ' + total + ' 项  Selected');
      $('#TodoBatchToolbar').find('.batch-close-todo').prop('disabled', !hasSelection);
      $('#TodoSelectAll').prop('indeterminate', hasSelection && checked < total);
      $('#TodoSelectAll').prop('checked', checked === total && total > 0);
    }
    $(document).on('change', '#TodoShowClosed', function () {
      showTodoClosedFilter = this.checked;
      reloadTodayReport();
    });
    $(document).on('change', '#TodoSelectAll', function () {
      var checked = this.checked;
      $('#TodoCard .comm-checkbox:not(:disabled)').prop('checked', checked);
      updateTodoBatchToolbar();
    });
    $(document).on('change', '#TodoCard .comm-checkbox', function () {
      updateTodoBatchToolbar();
    });
    $(document).on('click', '.batch-close-todo', function () {
      var checked = $('#TodoCard .comm-checkbox:checked');
      if (!checked.length) return;
      if (commActionLock) { Swal.fire({ icon:'warning', title:swalTitle('请稍候','Please Wait'), html:swalHtml('上一操作仍在处理中，请稍后再试。','Previous action is still in progress. Please wait.'), timer:2000, showConfirmButton:false }); return; }
      var itemIds = checked.closest('.item-row').map(function () { return $(this).data('item-id'); }).get().filter(Boolean);
      if (!itemIds.length) { showError('所选项目缺少 ID，请先保存后再操作。', 'Selected items need to be saved first.'); return; }
      Swal.fire({
        icon:'question', title:swalTitle('批量关闭','Batch Close'),
        html:swalHtml(`确认关闭选中的 ${itemIds.length} 条待办事项？<br>关闭后不再跨天带出。`, `Close ${itemIds.length} selected to-do items?`),
        showCancelButton:true, confirmButtonText:'确认 / Confirm', cancelButtonText:'取消 / Cancel'
      }).then(result => {
        if (!result.isConfirmed) return;
        commActionLock = true;
        $('#TodoBatchToolbar button').prop('disabled', true);
        $('#TodoCard .comm-checkbox, #TodoSelectAll').prop('disabled', true);
        Swal.fire({ title: swalTitle('批量关闭中...','Batch Closing...'), html: swalHtml('正在处理 ' + itemIds.length + ' 条待办事项，请稍候。','Processing ' + itemIds.length + ' items, please wait.'), allowOutsideClick: false, showConfirmButton: false, didOpen: function () { Swal.showLoading(); } });
        google.script.run
          .withSuccessHandler(raw => {
            Swal.close(); commActionLock = false;
            updateTodoBatchToolbar();
            $('#TodoBatchToolbar button').prop('disabled', false);
            $('#TodoCard .comm-checkbox, #TodoSelectAll').prop('disabled', false);
            var r = parseResponse(raw);
            if (r.success) { showSuccess('已关闭 ' + r.updated + ' 条。', r.updated + ' items closed.'); reloadTodayReport(); }
            else showError(r.message || '操作失败', 'Operation failed');
          })
          .withFailureHandler(err => {
            Swal.close(); commActionLock = false;
            updateTodoBatchToolbar();
            $('#TodoBatchToolbar button').prop('disabled', false);
            $('#TodoCard .comm-checkbox, #TodoSelectAll').prop('disabled', false);
            showError(err.message || String(err), 'Operation failed');
          })
          .batchUpdateINJSDMItems(JSON.stringify(itemIds), 'CLOSED', userName, userEmail);
      });
    });
    $(document).on('click', '.show-bulk', function () { $(this).closest('.issue-card').find('.bulk-panel').addClass('open').find('textarea').focus(); });
    $(document).on('click', '.cancel-bulk', function () { $(this).closest('.bulk-panel').removeClass('open'); });
    $(document).on('click', '.import-bulk', function () {
      const panel = $(this).closest('.bulk-panel');
      const card = panel.closest('.issue-card');
      const type = card.attr('id') === 'MajorCard' ? 'major' : 'outstanding';
      const result = parseBulk(panel.find('textarea').val());
      if (!result.parsed.length) return showError('未识别到有效内容。', 'No valid entries were found.');
      const rows = card.find('.item-row');
      if (rows.length === 1 && !rows.find('.machine-no').val().trim() && !rows.find('.description').val().trim()) rows.remove();
      result.parsed.forEach(item => addIssueRow(type, item));
      panel.removeClass('open').find('textarea').val('');
      if (result.invalid.length) {
        Swal.fire({ icon:'warning', title:swalTitle('部分内容未识别','Some Lines Were Not Parsed'), html:swalHtml(`已生成 ${result.parsed.length} 条；未识别：${result.invalid.join('；')}`, `${result.parsed.length} records created. Please review unrecognized lines.`) });
      } else showSuccess(`已生成 ${result.parsed.length} 条记录。`, `${result.parsed.length} records created.`);
    });

    $('#SaveReport').on('click', function () {
      const payload = collectAndValidate();
      if (!payload) return showError('请根据页面红色提示修正数据。', 'Please correct the highlighted fields.');
      showLoading('保存中...', 'Saving...');
      google.script.run
        .withSuccessHandler(raw => {
          Swal.close();
          const result = parseResponse(raw);
          if (!result.success) return showError(result.message || '保存失败', 'Failed to save.');
          showSuccess(result.updated ? '记录已更新。' : '记录已保存。', result.updated ? 'Record updated.' : 'Record saved.');
          reloadTodayReport();
        })
        .withFailureHandler(error => { Swal.close(); showError(error.message || String(error), 'Failed to save.'); })
        .saveINJSDMReport(payload, userName, userEmail);
    });

    $('#CancelEdit').on('click', resetForm);
    $('#ReportDate').on('change', reloadTodayReport);
    $('#HistoryTab').on('shown.bs.tab', loadHistory);

    $(document).on('click', '.view-report', function () {
      const report = historyRecords.find(x => x.reportId === $(this).data('id'));
      if (report) renderDetail(report);
    });
    $(document).on('click', '.edit-report', function () {
      const report = historyRecords.find(x => x.reportId === $(this).data('id'));
      if (!report) return;
      populateForm(report);
      bootstrap.Tab.getOrCreateInstance(document.querySelector('[data-bs-target="#EntryPane"]')).show();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    $(document).on('click', '.delete-report', function () {
      const reportId = $(this).data('id');
      Swal.fire({
        icon:'warning', title:swalTitle('确认删除','Confirm Deletion'),
        html:swalHtml('删除后记录将不再显示，是否继续？','The record will be hidden after deletion. Continue?'),
        showCancelButton:true, confirmButtonText:'确认 / Confirm', cancelButtonText:'取消 / Cancel'
      }).then(result => {
        if (!result.isConfirmed) return;
        showLoading('删除中...', 'Deleting...');
        google.script.run
          .withSuccessHandler(raw => {
            Swal.close();
            const response = parseResponse(raw);
            if (!response.success) return showError(response.message || '删除失败', 'Failed to delete.');
            showSuccess('记录已删除。', 'Record deleted.');
            loadHistory();
          })
          .withFailureHandler(error => { Swal.close(); showError(error.message || String(error), 'Failed to delete.'); })
          .deleteINJSDMReport(reportId, userName, userEmail);
      });
    });

    showLoading('加载数据中...', 'Loading Data...');
    google.script.run
      .withSuccessHandler(raw => {
        Swal.close();
        const result = parseResponse(raw);
        if (!result.success) return showError(result.message || '加载失败', 'Failed to initialize.');
        if (!result.hasPermission) {
          $('#PermissionDenied').removeClass('d-none');
          return;
        }
        scUsers = result.scUsers || [];
        historyCommItems = result.historyCommItems || [];
        historyItemIds = new Set(historyCommItems.map(function (item) { return item.itemId; }).filter(Boolean));
        historyTodoItems = result.historyTodoItems || [];
        historyTodoItemIds = new Set(historyTodoItems.map(function (item) { return item.itemId; }).filter(Boolean));
        $('#AppContent').removeClass('d-none');
        resetForm();
        // 初始化拖拽排序
        function initSortable() {
          $('.item-list').each(function() {
            if (this._sortableInstance) this._sortableInstance.destroy();
            this._sortableInstance = Sortable.create(this, {
              handle: '.drag-handle',
              animation: 150,
              ghostClass: 'sortable-ghost',
              chosenClass: 'sortable-chosen',
              onEnd: function() { updateCounts(); }
            });
          });
        }
        initSortable();
        if (result.todayReport) {
          populateForm(result.todayReport);
        } else {
          if (historyCommItems.length) {
            $('#CommunicationCard .item-list').append('<div class="history-divider"><span>历史跟进事项 / Historical Follow-Up</span></div>');
            historyCommItems.forEach(item => addCommunicationRow(item));
          }
          if (historyTodoItems.length) {
            $('#TodoCard .item-list').append('<div class="history-divider"><span>历史待办 / Historical To-Do</span></div>');
            historyTodoItems.forEach(item => addTodoRow(item));
          }
        }
      })
      .withFailureHandler(error => { Swal.close(); showError(error.message || String(error), 'Failed to initialize.'); })
      .getINJSDMInitData(userName, userEmail, null, showClosedFilter);
  });
</script>
