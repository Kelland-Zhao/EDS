<script>
// ============================================================
//  新品测试工艺参数 JS / NPI Process Record JS
// ============================================================
const swalTitle = (cn, en) => `${cn}<span style="display:block;font-size:0.65em;color:#888;font-weight:400;line-height:1.3;margin-top:4px;">${en}</span>`;
const swalHtml = (cn, en) => `<div>${cn}<div style="font-size:0.85em;color:#888;margin-top:6px;line-height:1.4;">${en}</div></div>`;
function parseResponse(raw) { return typeof raw === 'string' ? JSON.parse(raw) : raw; }
const swalLoading = (cn, en) => {
  var start = Date.now();
  return {
    title: swalTitle(cn, en.title || en),
    html: swalHtml(cn, en.html || en) + '<div style="margin-top:8px;font-size:12px;color:#adb5bd;">⏱ <span class="swal-timer">0</span>s</div>',
    allowOutsideClick: false,
    showConfirmButton: false,
    didOpen: function () {
      Swal.showLoading();
      var el = document.querySelector('.swal-timer');
      if (el) {
        el._interval = setInterval(function () { el.textContent = Math.floor((Date.now() - start) / 1000); }, 1000);
      }
    },
    willClose: function () {
      var els = document.querySelectorAll('.swal-timer');
      els.forEach(function (el) { if (el._interval) clearInterval(el._interval); });
    }
  };
};

// ===== 表驱动模板（数据源：NPI_Templates + NPI_MachineMap，后端接口 loadNPITemplateData） =====
let templateData = null;    // {cards: {卡名: [行...]}, machineMap: {byRaw, byDisplay}}
let currentCompose = null;  // 当前任务卡组合 [{card, count, instance, idx, prefix}]
let enabledSections = {};   // 区块开关状态 {sectionUid: bool}
// 默认禁用区块（保持旧 UX：FC 炮筒 B/C/D 默认关）
const DEFAULT_DISABLED_SECTIONS = { 'FCS/ENG': ['炮筒B', '炮筒C', '炮筒D'] };
const HOT_RUNNER_DEFAULT_COUNT = 12;

// 卡组合：中间层 → 展开卡实例列表；组合总卡数>1 时所有字段带序号前缀（存储 key）
function composeCardList(byDisplay, display) {
  var specs = (byDisplay && byDisplay[display]) || [];
  if (!specs.length) return null;
  var sorted = specs.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  var total = 0;
  sorted.forEach(function (s) { total += Math.max(1, parseInt(s.count || 1, 10)); });
  var multi = total > 1;
  var out = [], idx = 0;
  sorted.forEach(function (s) {
    var n = Math.max(1, parseInt(s.count || 1, 10));
    for (var i = 0; i < n; i++) {
      idx++;
      out.push({ card: s.card, count: n, instance: i + 1, idx: idx, prefix: multi ? idx + '_' : '' });
    }
  });
  return out;
}

// 字段存储 key：{实例前缀}{行key}[_{分段}]
function fieldKeyFor(inst, rowKey, seg) {
  return (inst.prefix || '') + rowKey + (seg ? '_' + seg : '');
}

// 位置表：卡行序 + 分段展开 → key→pos（旧 196 数组兼容）
function buildPositionMap(cardRows) {
  var map = {}, pos = 0;
  cardRows.forEach(function (r) {
    if (r.segs && r.segs.length) {
      r.segs.forEach(function (seg) { map[r.key + '_' + seg] = pos++; });
    } else {
      map[r.key] = pos++;
    }
  });
  return map;
}

// 旧记录数组 → 键值对象：稳定区段按位置表转换（排除配套设备/备注——设备按启用顺序动态定位、备注受设备数量影响）；
// 尾部最后一位=备注，其余=遗留设备值（aux_legacy_N）
function convertOldFieldsToObject(fields, cardRows) {
  if (!Array.isArray(fields)) return fields;
  var remarksRow = null;
  (cardRows || []).forEach(function (r) { if (r.sec === '备注' && !remarksRow) remarksRow = r; });
  var remarksKey = remarksRow ? remarksRow.key : 'remarks';
  var stableRows = (cardRows || []).filter(function (r) { return r.sec !== '配套设备' && r.sec !== '备注'; });
  var map = buildPositionMap(stableRows);
  var lastPos = -1;
  Object.keys(map).forEach(function (k) { if (map[k] > lastPos) lastPos = map[k]; });
  var out = {};
  Object.keys(map).forEach(function (k) {
    var v = fields[map[k]];
    if (v !== undefined && v !== '') out[k] = v;
  });
  var tail = fields.slice(lastPos + 1);
  if (tail.length) {
    var remarkVal = tail[tail.length - 1];
    if (remarkVal !== undefined && remarkVal !== '') out[remarksKey] = remarkVal;
    for (var i = 0; i < tail.length - 1; i++) {
      if (tail[i] !== undefined && tail[i] !== '') out['aux_legacy_' + (i + 1)] = tail[i];
    }
  }
  return out;
}

let currentTask = null;
let currentRecord = null;
let allTasks = [];
let viewingHistory = false; // 正在查看历史版本
let latestRecord = null;   // 最新版本记录（返回最新用）

$(document).ready(function () {
  var perm = sessionStorage.getItem('EDSTaskPermission') || '';
  var permLabels = { 'admin': '管理员 / Admin', 'supervisor': '主管 / Supervisor', 'employee': '员工 / Employee' };
  var label = permLabels[perm] || ('员工 / Employee');
  $('#userLevelBadge').removeClass('bg-secondary bg-danger bg-warning').addClass(perm === 'admin' ? 'bg-danger' : (perm === 'supervisor' ? 'bg-warning text-dark' : 'bg-secondary')).text(label);

  // Loading toast per UI规范 §4.11.2
  Swal.fire(swalLoading('加载数据中...', { title: 'Loading Data...', html: '正在获取任务列表，请稍候。' }));

  loadTemplateData(function () { loadTaskList(applyUrlParams_); });

  $('#taskSelect').on('change', function () { var tid = $(this).val(); if (tid) selectTask(tid); else clearForm(); });
  $('#btnSaveDraft').on('click', saveRecord);
  $('#btnSubmit').on('click', submitRecord);
  $('#btnPromote').on('click', promoteToTBX);
  $('#btnFillTest').on('click', fillTestData);
  $('#btnEditTask').on('click', openEditModal);
  $('#btnDeleteTask').on('click', doDeleteTask);
  $('#btnNewVersion').on('click', createNewVersion);
  $('#btnBackToLatest').on('click', backToLatest);
});

// 拉取表驱动模板数据（页面级缓存一次）
function loadTemplateData(callback) {
  google.script.run
    .withSuccessHandler(function (raw) {
      var r = parseResponse(raw);
      templateData = r.success ? r.data : null;
      if (callback) callback();
    })
    .withFailureHandler(function () { templateData = null; if (callback) callback(); })
    .loadNPITemplateData();
}

var HOT_RUNNER_POSITIONS = [
  {v:'流道板',t:'流道板 / Manifold',c:'hr-pos-manifold'},
  {v:'主灌嘴',t:'主灌嘴 / Main Nozzle',c:'hr-pos-nozzle'},
  {v:'底板',t:'底板 / Bottom Plate',c:'hr-pos-bottom'},
  {v:'手按位',t:'手按位 / Manual Zone',c:'hr-pos-manual'},
  {v:'头胶',t:'头胶 / Front Glue',c:'hr-pos-front'},
  {v:'尾胶',t:'尾胶 / Rear Glue',c:'hr-pos-rear'},
  {v:'舌苔',t:'舌苔 / Tongue',c:'hr-pos-tongue'},
  {v:'其他',t:'其他 / Other',c:'hr-pos-other'}
];


function currentHotRunnerKeys() {
  // 返回当前热流道点位数（按 temp 输入计数，兼容实例前缀 key）
  var n = 0;
  $('#hotRunnerContainer').find('input.npi-field').each(function () {
    var k = String($(this).data('key') || '');
    if (/_temp_\d+$/.test(k)) n++;
  });
  return n;
}

function renderHotRunner(n, inst) {
  n = n || HOT_RUNNER_DEFAULT_COUNT;
  var maxColsPerRow = 12;
  var groups = Math.ceil(n / maxColsPerRow);
  var html = '<div id="hotRunnerContainer">';
  // Batch controls above all groups
  html += '<div class="d-flex align-items-center gap-2 flex-wrap mb-2">';
  html += '<input type="number" id="hotRunnerBatchCount" value="1" min="1" style="width:60px;" class="form-control form-control-sm">';
  html += '<span style="font-size:12px;color:#6c757d;">点位<br><small>Zones</small></span>';
  html += '<button class="btn btn-sm btn-outline-secondary" onclick="addHotRunnerCol()"><i class="bi bi-plus"></i> 增加<br><small>Add</small></button>';
  html += '<button class="btn btn-sm btn-outline-secondary" onclick="removeHotRunnerCol()"><i class="bi bi-dash"></i> 减少<br><small>Remove</small></button>';
  html += '</div>';
  for (var g = 0; g < groups; g++) {
    var start = g * maxColsPerRow + 1;
    var end = Math.min(start + maxColsPerRow - 1, n);
    html += '<div class="hot-runner-group" style="overflow-x:auto;margin-bottom:12px;">';
    html += '<table class="table table-sm table-bordered" style="font-size:12px;margin-bottom:0;">';
    html += '<thead><tr style="background:#f8f9fa;"><th style="width:80px;">序号<br><small>Seq</small></th>';
    for (var i = start; i <= end; i++) {
      html += '<th style="text-align:center;min-width:90px;">' + i + '</th>';
    }
    html += '</tr></thead><tbody>';
    // Position row
    html += '<tr><td style="font-weight:600;background:#f8f9fa;">位置<br><small>Position</small></td>';
    for (var i2 = start; i2 <= end; i2++) {
      html += '<td><div class="input-group input-group-sm"><select class="form-select form-select-sm npi-field hr-pos-select" data-key="' + fieldKeyFor(inst, 'hotRunner_pos', i2) + '" onchange="updateHRPosColor(this)"><option value="">-- / Select --</option>';
      HOT_RUNNER_POSITIONS.forEach(function (pp) {
        html += '<option value="' + pp.v + '">' + pp.t + '</option>';
      });
      html += '</select><button class="btn btn-outline-secondary btn-sm" onclick="copyHotRunnerPosRight(' + i2 + ',' + n + ')" title="复制到右侧所有列 / Copy to all columns to the right" type="button" style="font-size:10px;"><i class="bi bi-arrow-right"></i></button></div></td>';
    }
    html += '</tr>';
    // Temperature row
    html += '<tr><td style="font-weight:600;background:#f8f9fa;">温度<br><small>Temp (°C)</small></td>';
    for (var i3 = start; i3 <= end; i3++) {
      html += '<td><input type="number" class="form-control form-control-sm npi-field" data-key="' + fieldKeyFor(inst, 'hotRunner_temp', i3) + '" step="any" placeholder="°C" style="width:70px;margin:0 auto;display:block;"></td>';
    }
    html += '</tr></tbody></table>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function reRenderHotRunner(newN) {
  // Save all current field values before re-rendering
  var saved = {};
  $('#hotRunnerContainer').find('.npi-field').each(function () {
    var key = $(this).data('key');
    if (key) saved[key] = $(this).val();
  });
  var inst = currentHotRunnerInst || { prefix: '', card: '', instance: 1, idx: 1 };
  $('#hotRunnerContainer').replaceWith(renderHotRunner(newN, inst));
  // Restore values that still exist
  for (var key in saved) {
    $('[data-key="' + key + '"]').val(saved[key]);
  }
  $('.hr-pos-select').each(function () { updateHRPosColor(this); });
}

function addHotRunnerCol() {
  var n = currentHotRunnerKeys() || HOT_RUNNER_DEFAULT_COUNT;
  var batch = parseInt($('#hotRunnerBatchCount').val()) || 1;
  if (batch <= 0) return;
  reRenderHotRunner(n + batch);
}

function removeHotRunnerCol() {
  var n = currentHotRunnerKeys() || HOT_RUNNER_DEFAULT_COUNT;
  var batch = parseInt($('#hotRunnerBatchCount').val()) || 1;
  if (n - batch < 1) batch = n - 1;
  if (batch <= 0) return;
  reRenderHotRunner(n - batch);
}

// ===== 表驱动渲染 =====
var currentHotRunnerInst = null; // 热流道所属卡实例（增减点位时用）

function renderTemplateForTask(task) {
  var display = String(task.machineModel || '').trim();
  var byDisplay = (templateData && templateData.machineMap) ? templateData.machineMap.byDisplay : {};
  currentCompose = composeCardList(byDisplay, display);
  if (!currentCompose) {
    currentCompose = [{ card: 'FCS/ENG', count: 1, instance: 1, idx: 1, prefix: '' }];
    if (display) {
      Swal.fire({ icon: 'warning', title: swalTitle('未配置模板', 'No Template'), html: swalHtml('机型「' + display + '」暂无对应模板，已按 FCS/ENG 渲染。', 'No template for model "' + display + '", rendered with FCS/ENG.'), timer: 3000, showConfirmButton: false });
    }
  }
  renderTemplate();
}

function renderTemplate() {
  var html = '';
  enabledSections = {};
  currentHotRunnerInst = null;
  // 任务级产品信息：所有卡一致，只渲染一次，key 不带实例前缀
  var piInst = { card: 'shared', count: 1, instance: 1, idx: 0, prefix: '' };
  var piRows = getSharedProductInfoRows();
  if (piRows.length) {
    var collapseId = 'collapse_shared_productInfo';
    html += '<div class="accordion-item">';
    html += '<h2 class="accordion-header">';
    html += '<button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#' + collapseId + '">产品信息<br><small>Product Info</small></button>';
    html += '</h2>';
    html += '<div id="' + collapseId + '" class="accordion-collapse collapse show" data-bs-parent="#paramAccordion">';
    html += '<div class="accordion-body"><div class="row g-2">';
    piRows.forEach(function (r) { html += renderTemplateRow(piInst, r); });
    html += '</div></div></div></div>';
  }
  currentCompose.forEach(function (inst, i) {
    var rows = (templateData && templateData.cards && templateData.cards[inst.card]) || [];
    if (!rows.length) {
      html += '<div class="text-muted p-2">卡「' + inst.card + '」无模板行 / No template rows</div>';
      return;
    }
    var multi = currentCompose.length > 1;
    if (multi) {
      // 卡级开关 + 折叠
      var uid = 'card_' + inst.idx;
      var defOn = inst.instance === 1;
      enabledSections[uid] = defOn;
      html += '<div class="mb-3" id="section_' + uid + (defOn ? '' : ' barrel-disabled') + '">';
      html += '<label class="barrel-toggle"><input type="checkbox" id="toggle_' + uid + '" ' + (defOn ? 'checked' : '') + ' onchange="toggleNpiSection(\'' + uid + '\')"><span class="toggle-switch"></span> <strong style="font-size:13px;">' + inst.card + (inst.count > 1 ? ' #' + inst.instance : '') + '</strong></label>';
      html += '<div class="row g-2 mt-1">';
      html += renderCardSections(inst, rows);
      html += '</div></div>';
    } else {
      html += renderCardSections(inst, rows);
    }
  });
  html += '<div id="auxLegacyBox"></div>';
  $('#paramAccordion').html(html);
}

// ===== 配套设备（旧交互：下拉选设备 + 添加 + 卡片开关；类型/字段来自模板行 key） =====
var equipmentTypes = {};  // uid → [{id, cn, en, fields: [row...]}]
var equipmentInst = {};   // uid → 卡实例
var activeEquipment = []; // [{uid, typeId, enabled}]

function renderEquipmentBlock(inst, rows) {
  var uid = 'equip_' + inst.idx;
  equipmentInst[uid] = inst;
  // 从行 key 解析设备类型：auxEquip_{type}_{field}
  var types = [];
  rows.forEach(function (r) {
    var m = String(r.key || '').match(/auxEquip_([^_]+)_/);
    if (!m) return;
    var t = null;
    types.forEach(function (x) { if (x.id === m[1]) t = x; });
    if (!t) {
      var cn = String(r.cn || '').split(' ')[0];
      var en = String(r.en || '').replace(/\s+\S+$/, '');
      t = { id: m[1], cn: cn, en: en, fields: [] };
      types.push(t);
    }
    t.fields.push(r);
  });
  equipmentTypes[uid] = types;
  var html = '<div class="col-12 mb-2" id="' + uid + '"><strong style="font-size:12px;">配套设备信息<br><small>Auxiliary Equipment</small></strong>';
  html += '<div class="d-flex align-items-center gap-2 mb-2"><select id="' + uid + '_select" class="form-select form-select-sm" style="width:auto;"><option value="">-- 选择设备 / Select Device --</option>';
  types.forEach(function (t) {
    html += '<option value="' + t.id + '">' + t.cn + (t.en ? ' / ' + t.en : '') + '</option>';
  });
  html += '</select><button class="btn btn-sm btn-outline-secondary" onclick="addEquipment(\'' + uid + '\')"><i class="bi bi-plus"></i> 添加 / Add</button></div>';
  html += '<div id="' + uid + '_list"></div></div>';
  return html;
}

function addEquipment(uid) {
  var sel = $('#' + uid + '_select').val();
  if (!sel) return;
  if (activeEquipment.some(function (a) { return a.uid === uid && a.typeId === sel; })) {
    Swal.fire({ icon: 'warning', title: swalTitle('已添加', 'Already Added'), html: swalHtml('该设备已存在。', 'Device already exists.'), timer: 1500, showConfirmButton: false });
    return;
  }
  activeEquipment.push({ uid: uid, typeId: sel, enabled: true });
  renderEquipCards(uid);
}

function removeEquipment(uid, idx) {
  activeEquipment = activeEquipment.filter(function (a, i2) { return !(a.uid === uid && i2 === idx); });
  renderEquipCards(uid);
}

function toggleEquipment(uid, idx) {
  var ae = activeEquipment[idx];
  if (!ae) return;
  if (ae.enabled) {
    // 已有数据的设备禁止关闭
    var card = $('#equipCard_' + uid + '_' + idx);
    var hasData = false;
    card.find('.npi-field').each(function () {
      if (String($(this).val() || '').trim()) hasData = true;
    });
    if (hasData) {
      card.find('input[type="checkbox"]').prop('checked', true);
      Swal.fire({ icon: 'warning', title: swalTitle('无法关闭', 'Cannot Disable'), html: swalHtml('该设备已有数据，如需关闭请先清空其内容。', 'This device has data. Clear its values before disabling.'), timer: 2500, showConfirmButton: false });
      return;
    }
  }
  ae.enabled = !ae.enabled;
  var card = $('#equipCard_' + uid + '_' + idx);
  if (ae.enabled) {
    card.removeClass('barrel-disabled');
  } else {
    card.addClass('barrel-disabled');
    card.find('.npi-field').val('');
  }
}

function renderEquipCards(uid) {
  var inst = equipmentInst[uid];
  if (!inst) return;
  var html = '';
  activeEquipment.forEach(function (ae, idx) {
    if (ae.uid !== uid) return;
    var t = null;
    (equipmentTypes[uid] || []).forEach(function (x) { if (x.id === ae.typeId) t = x; });
    if (!t) return;
    var disabledClass = ae.enabled ? '' : ' barrel-disabled';
    html += '<div class="equip-card mb-2' + disabledClass + '" id="equipCard_' + uid + '_' + idx + '">';
    html += '<div class="d-flex justify-content-between align-items-center mb-1">';
    html += '<label class="barrel-toggle mb-0"><input type="checkbox" ' + (ae.enabled ? 'checked' : '') + ' onchange="toggleEquipment(\'' + uid + '\', ' + idx + ')"><span class="toggle-switch"></span> <strong style="font-size:12px;">' + t.cn + ' <small style="color:#888;">' + t.en + '</small></strong></label>';
    html += '<button class="btn btn-sm btn-outline-danger" onclick="removeEquipment(\'' + uid + '\', ' + idx + ')" title="移除 / Remove" style="font-size:10px;padding:1px 6px;">× 移除<br><small>Remove</small></button>';
    html += '</div>';
    html += '<div class="row g-1">';
    t.fields.forEach(function (f) {
      var key = fieldKeyFor(inst, f.key, '');
      var fcn = String(f.cn || '').split(' ').slice(1).join(' ') || f.cn;
      var fen = String(f.en || '').replace(/^\S+\s/, '');
      var isNum = f.type === 'number';
      html += '<div class="col-6 col-md-4 col-lg-3"><label class="form-label-sm">' + fcn + (fen ? '<br><small>' + fen + '</small>' : '') + '</label>';
      html += '<input type="' + (isNum ? 'number' : 'text') + '" class="form-control form-control-sm npi-field" data-key="' + key + '" data-unit="' + (f.unit || '') + '"' + (isNum ? ' step="any" min="0"' : '') + '>';
      html += '</div>';
    });
    html += '</div></div>';
  });
  $('#' + uid + '_list').html(html);
}

// 回填：记录中含设备值（含实例前缀 key）时自动添加对应设备卡片
function ensureEquipmentForKey(key) {
  var m = String(key).match(/auxEquip_([^_]+)_/);
  if (!m) return;
  var typeId = m[1];
  (currentCompose || []).forEach(function (inst) {
    var rows = (templateData && templateData.cards && templateData.cards[inst.card]) || [];
    var has = rows.some(function (r) { return String(r.key || '').indexOf('auxEquip_' + typeId + '_') >= 0; });
    if (!has) return;
    var uid = 'equip_' + inst.idx;
    if (!$('#' + uid).length) return;
    if (activeEquipment.some(function (a) { return a.uid === uid && a.typeId === typeId; })) return;
    activeEquipment.push({ uid: uid, typeId: typeId, enabled: true });
    renderEquipCards(uid);
  });
}

// 任务级产品信息行：取组合首卡的产品信息行；无则回退 FCS/ENG 卡
function getSharedProductInfoRows() {
  var out = [];
  var sources = (currentCompose || []).map(function (c) { return c.card; }).concat(['FCS/ENG']);
  var seen = {};
  sources.forEach(function (card) {
    (templateData && templateData.cards && templateData.cards[card] || []).forEach(function (r) {
      if (r.sec === '产品信息' && !seen[r.key]) { seen[r.key] = true; out.push(r); }
    });
  });
  return out;
}

// 单卡模式：区块 = accordion 项（首个展开）；多卡模式：区块 = 子标题块
function renderCardSections(inst, rows) {
  var multi = currentCompose.length > 1;
  var secOrder = [];
  rows.forEach(function (r) { if (r.sec !== '产品信息' && secOrder.indexOf(r.sec) < 0) secOrder.push(r.sec); });
  var html = '';
  var isFirst = true;
  secOrder.forEach(function (sec) {
    var secRows = rows.filter(function (r) { return r.sec === sec && r.sec !== '产品信息'; });
    var secEn = secRows[0].secEn || '';
    var isHR = secRows.some(function (r) { return String(r.key || '').indexOf('hotRunner_') === 0; });
    var isBarrel = /^炮筒[ABCD]$/.test(sec);
    var defaultDisabled = isHR || ((DEFAULT_DISABLED_SECTIONS[inst.card] || []).indexOf(sec) >= 0);
    if (sec === '配套设备') {
      html += renderEquipmentBlock(inst, secRows);
      return;
    }
    if (isHR) {
      // 热流道：开关 + 表格
      var uid = 'hr_' + inst.idx;
      enabledSections[uid] = !defaultDisabled;
      currentHotRunnerInst = inst;
      html += '<div class="col-12 mb-2" id="section_' + uid + '">';
      html += '<label class="barrel-toggle"><input type="checkbox" id="toggle_' + uid + '" ' + (!defaultDisabled ? 'checked' : '') + ' onchange="toggleNpiSection(\'' + uid + '\')"><span class="toggle-switch"></span> <strong style="font-size:12px;">' + sec + '<br><small>' + secEn + '</small></strong></label>';
      html += '<div class="hot-runner-content' + (defaultDisabled ? ' barrel-disabled' : '') + '">';
      var hrCount = HOT_RUNNER_DEFAULT_COUNT;
      secRows.forEach(function (r) { if (r.key === 'hotRunner_temp' && r.segs && r.segs.length) hrCount = r.segs.length; });
      html += renderHotRunner(hrCount, inst);
      html += '</div></div>';
    } else if (multi) {
      html += '<div class="col-12 mb-2"><strong style="font-size:12px;">' + sec + '<br><small>' + secEn + '</small></strong><div class="row g-2 mt-1">';
      secRows.forEach(function (r) { html += renderTemplateRow(inst, r); });
      html += '</div></div>';
    } else {
      var uid2 = 'sec_' + inst.idx + '_' + (secOrder.indexOf(sec) + 1);
      enabledSections[uid2] = !defaultDisabled;
      var collapseId = 'collapse_' + uid2;
      var toggleable = isBarrel || defaultDisabled;
      html += '<div class="accordion-item">';
      html += '<h2 class="accordion-header d-flex align-items-center gap-2">';
      if (toggleable) {
        html += '<label class="barrel-toggle" onclick="event.stopPropagation()"><input type="checkbox" id="toggle_' + uid2 + '" ' + (!defaultDisabled ? 'checked' : '') + ' onchange="toggleNpiSection(\'' + uid2 + '\')"><span class="toggle-switch"></span></label>';
      }
      html += '<button class="accordion-button flex-grow-1' + (isFirst ? '' : ' collapsed') + '" type="button" data-bs-toggle="collapse" data-bs-target="#' + collapseId + '">' + sec + '<br><small>' + secEn + '</small></button>';
      html += '</h2>';
      html += '<div id="' + collapseId + '" class="accordion-collapse collapse' + (isFirst ? ' show' : '') + '" data-bs-parent="#paramAccordion">';
      html += '<div class="accordion-body' + (defaultDisabled ? ' barrel-disabled' : '') + '" id="section_' + uid2 + '">';
      html += '<div class="row g-2">';
      secRows.forEach(function (r) { html += renderTemplateRow(inst, r); });
      html += '</div></div></div></div>';
      isFirst = false;
    }
  });
  return html;
}

function renderTemplateRow(inst, r) {
  var segs = r.segs || [];
  var label = r.cn + (r.en ? '<br><small>' + r.en + '</small>' : '');
  var isNumber = r.type === 'number';
  var isTextarea = r.cn === '备注' || /remarks/.test(r.key || '');
  var readonly = r.cn === '工艺卡编号' || r.key === 'productInfo_10';
  var html = '';
  if (segs.length) {
    var baseKey = fieldKeyFor(inst, r.key, '');
    var rowId = 'row_' + baseKey.replace(/[^A-Za-z0-9_]/g, '_');
    html += '<div class="col-12 mb-2" id="' + rowId + '"><label class="form-label-sm">' + label + '</label><div class="row g-1 align-items-end">';
    segs.forEach(function (seg) {
      var key = fieldKeyFor(inst, r.key, seg);
      html += '<div class="col-4 col-md-2 seg-cell"><input type="' + (isNumber ? 'number' : 'text') + '" class="form-control form-control-sm npi-field" data-key="' + key + '" data-base="' + baseKey + '" data-unit="' + (r.unit || '') + '" placeholder="' + seg + '"' + (isNumber ? ' step="any" min="0"' : '') + '></div>';
    });
    html += '<div class="col-auto"><button class="btn btn-sm btn-outline-secondary seg-btn" onclick="addSegmentDynamic(\'' + rowId + '\', \'' + baseKey + '\', \'' + (isNumber ? 'number' : 'text') + '\', \'' + (r.unit || '') + '\')" title="增加一段 / Add"><i class="bi bi-plus"></i></button></div>';
    html += '<div class="col-auto"><button class="btn btn-sm btn-outline-secondary seg-btn" onclick="removeSegmentDynamic(\'' + rowId + '\')" title="减少一段 / Remove"><i class="bi bi-dash"></i></button></div>';
    html += '</div></div>';
  } else if (isTextarea) {
    var key = fieldKeyFor(inst, r.key, '');
    html += '<div class="col-12 mb-2"><label class="form-label-sm">' + label + '</label>';
    html += '<textarea class="form-control form-control-sm npi-field" data-key="' + key + '" data-unit="' + (r.unit || '') + '" rows="3"></textarea></div>';
  } else {
    var key2 = fieldKeyFor(inst, r.key, '');
    html += '<div class="col-6 col-md-4 col-lg-3 mb-2">';
    html += '<label class="form-label-sm">' + label + '</label>';
    html += '<input type="' + (isNumber ? 'number' : 'text') + '" class="form-control form-control-sm npi-field" data-key="' + key2 + '" data-unit="' + (r.unit || '') + '"' + (isNumber ? ' step="any" min="0"' : '') + (readonly ? ' readonly' : '') + (r.preset ? ' placeholder="' + r.preset + '"' : '') + '>';
    html += '</div>';
  }
  return html;
}

// 分段动态增删（存储为键值，多出的段保存/回填均按 key 处理）
function addSegmentDynamic(rowId, baseKey, inputType, unit) {
  var cells = $('#' + rowId).find('.seg-cell');
  var n = cells.length + 1;
  var first = cells.first().find('input').attr('placeholder') || '';
  var label;
  if (/^\d+段$/.test(first)) label = n + '段';
  else if (/^\d+$/.test(first)) label = String(n);
  else if (/^[一二三四五六七八九十]+段$/.test(first)) {
    var cn = ['一','二','三','四','五','六','七','八','九','十'];
    label = (n <= 10 ? cn[n - 1] : n) + '段';
  } else label = String(n);
  ensureSegmentInput(rowId, baseKey, label, inputType, unit);
}

function ensureSegmentInput(rowId, baseKey, label, inputType, unit) {
  var key = baseKey + '_' + label;
  if ($('[data-key="' + key + '"]').length) return; // 已存在
  var cell = '<div class="col-4 col-md-2 seg-cell"><input type="' + inputType + '" class="form-control form-control-sm npi-field" data-key="' + key + '" data-base="' + baseKey + '" data-unit="' + unit + '" placeholder="' + label + '"' + (inputType === 'number' ? ' step="any" min="0"' : '') + '></div>';
  $('#' + rowId).find('.col-auto').first().before(cell);
}

function removeSegmentDynamic(rowId) {
  var cells = $('#' + rowId).find('.seg-cell');
  if (cells.length <= 1) return;
  cells.last().remove();
}

// 回填时：对象中多出的分段（此前动态加段保存的）自动补渲染
function ensureSegmentsForObject(obj) {
  if (!obj || typeof obj !== 'object') return;
  Object.keys(obj).forEach(function (k) {
    if ($('[data-key="' + k + '"]').length) return;
    var m = k.match(/^(.+)_(.+)$/);
    if (!m) return;
    var baseEl = $('[data-base="' + m[1] + '"]').first();
    if (!baseEl.length) return;
    var rowEl = baseEl.closest('[id]');
    var rowId = rowEl.attr('id');
    ensureSegmentInput(rowId, m[1], m[2], baseEl.attr('type') || 'text', baseEl.data('unit') || '');
  });
}

function toggleNpiSection(uid) {
  // 以状态表为准取反（DOM class 状态在热流道等结构上不可靠）
  var cur = !!enabledSections[uid];
  if (cur) {
    // 已有数据的区块禁止关闭，防止保存时数据被静默丢弃
    var hasData = false;
    $('#section_' + uid + ' .npi-field').each(function () {
      if (String($(this).val() || '').trim()) hasData = true;
    });
    if (hasData) {
      $('#toggle_' + uid).prop('checked', true);
      Swal.fire({ icon: 'warning', title: swalTitle('无法关闭', 'Cannot Disable'), html: swalHtml('该区块已有数据，如需关闭请先清空区块内容。', 'This section has data. Clear its values before disabling.'), timer: 2500, showConfirmButton: false });
      return;
    }
  }
  setNpiSectionEnabled(uid, !cur);
}

function setNpiSectionEnabled(uid, on) {
  enabledSections[uid] = on;
  var section = $('#section_' + uid);
  if (!section.length) return;
  var targets = [section];
  var content = section.find('.hot-runner-content').first();
  if (content.length) targets.push(content); // 热流道禁用类在内容层
  if (on) {
    targets.forEach(function (t) { t.removeClass('barrel-disabled'); });
    var collapse = section.closest('.accordion-item').find('.accordion-collapse').first();
    if (collapse.length) collapse.collapse('show');
  } else {
    targets.forEach(function (t) { t.addClass('barrel-disabled'); });
    // 不清空数据：禁用区块不会被收集保存，重新开启时数据还在
    var collapse2 = section.closest('.accordion-item').find('.accordion-collapse').first();
    if (collapse2.length) collapse2.collapse('hide');
  }
  $('#toggle_' + uid).prop('checked', on);
}

          .withSuccessHandler(function (raw2) {

            if (r2.success && r2.cardNumber && !r2.isExisting) {

function fillFormFields(fields) {

  Object.keys(obj).forEach(function (k) { if (String(k).indexOf('auxEquip_') >= 0) ensureEquipmentForKey(k); });
  ensureSegmentsForObject(obj);
  var legacy = [];

      el.val(obj[k]);
      if (el.hasClass('hr-pos-select')) updateHRPosColor(el[0]);

      legacy.push({ key: k, val: obj[k] });

    if (enabledSections[uid]) return;

      if (String($(this).val() || '').trim()) hasData = true;

  });

// URL参数解析：taskID / new
function parsePageParams_(qs) {
  var out = {};
  (qs || '').replace(/^\?/, '').split('&').forEach(function (kv) {
    if (!kv) return;
    var p = kv.split('=');
    if (p[0]) out[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
  });
  return out;
}

// 页面初始化时应用URL参数：taskID自动选中 / new=1自动打开新建弹窗
function applyUrlParams_() {
  var apply = function (params) {
    if (params.taskID) {
      if ($('#taskSelect option[value="' + params.taskID + '"]').length) {
        $('#taskSelect').val(params.taskID);
        selectTask(params.taskID);
      }
    } else if (params.new === '1') {
      $('#btnNewTask').trigger('click');
    }
  };
  // GAS iframe 沙箱内 window.location.search 拿不到原始 URL 参数，用官方 API 获取
  try {
    google.script.url.getLocation(function (loc) {
      var p = {};
      if (loc && loc.parameter) {
        Object.keys(loc.parameter).forEach(function (k) { p[k] = loc.parameter[k]; });
      }
      apply(p);
    });
  } catch (e) {
    apply(parsePageParams_(window.location.search));
  }
}

    html += '<table class="table table-sm table-hover mb-0" style="font-size:12px;">';

    versions.forEach(function (v) {
      html += '<tr>';
      html += '<td>' + v.recordID + (v.isLatest ? ' <span class="badge bg-success">最新<br><small>Latest</small></span>' : '') + '</td>';
      html += '<td>' + v.status + '</td>';
      html += '<td>' + (v.cardNumber || '-') + '</td>';
      html += '<td>' + (v.updatedAt || v.createdAt || '-') + '</td>';
      html += '<td>' + (v.createdBy || '-') + '</td>';
      html += '<td><button class="btn btn-sm btn-outline-secondary" style="font-size:11px;" onclick="viewHistoryVersion(\'' + v.recordID + '\')">查看<br><small>View</small></button></td>';

  $('#newPlanDate').val(currentTask.planDate || '');
  $('#newDueDate').val(currentTask.dueDate || '');
  $('#newRemark').val(currentTask.remark || '');
  $('#newProductName').val(currentTask.productName || null);
  var skuTokens = (currentTask.sku || '').split(';').map(function (s) { return s.trim(); }).filter(Boolean);
  onProductSelected(currentTask.productName || '', function () {
    if (skuTokens.length) {
      if (!$('#newSku').is(':visible')) {
        $('#newSkuCustom').val(skuTokens.join('; '));
      } else {
        $('#newSku').val(skuTokens).trigger('change');
      }
    }
  });
  loadWorkcenterList(currentTask.processType || 'IM', function () {
    $('#newMachineNo').val(currentTask.machineNo || null).trigger('change');
  });
  $('#newTaskModal').modal('show');
}

function doDeleteTask() {
  if (!currentTask) return;
  Swal.fire({
    title: swalTitle('确认删除任务', 'Confirm Delete'),
    html: swalHtml('将删除任务 <b>' + currentTask.taskID + '</b> 及其全部工艺参数记录，且不可恢复。', 'Task ' + currentTask.taskID + ' and all its process records will be deleted permanently.'),
    icon: 'warning', showCancelButton: true,
    confirmButtonText: '确认删除 / Delete', cancelButtonText: '取消 / Cancel',
    confirmButtonColor: '#dc3545'
  }).then(function (r2) {
    if (!r2.isConfirmed) return;
    Swal.fire(swalLoading('删除中...', { title: 'Deleting...', html: '正在删除任务' }));
    google.script.run
      .withSuccessHandler(function (raw) {
        Swal.close();
        var r = parseResponse(raw);
        if (r.success) {
          clearForm();
          loadTaskList();
          Swal.fire({ icon: 'success', title: swalTitle('已删除', 'Deleted'), html: swalHtml(r.message, ''), timer: 2000, showConfirmButton: false });
        } else {
          Swal.fire({ icon: 'error', title: swalTitle('错误', 'Error'), html: swalHtml(r.message || '删除失败', 'Failed') });
        }
      })
      .withFailureHandler(function (err) { Swal.close(); Swal.fire({ icon: 'error', title: swalTitle('错误', 'Error'), html: swalHtml(err.message || String(err), 'Failed') }); })
      .deleteNPITestTask(currentTask.taskID);
  });
}

function fillTestData() {
  if (!currentTask) { Swal.fire({ icon:'warning', title:swalTitle('提示','Info'), html:swalHtml('请先选择测试任务','Please select a test task first') }); return; }
  $('.npi-field').each(function () {
    var $el = $(this);
    if ($el.is('textarea') || $el.is('select')) return;
    if ($el.closest('.barrel-disabled').length) return; // 禁用区块/卡实例跳过
    if ($el.prop('readonly')) return;
    // 按单位推断测试值
    var unit = String($el.data('unit') || '');
    var val = '100';
    if (unit.indexOf('℃') >= 0 || unit.indexOf('°C') >= 0) val = '200';
    else if (unit === 'Bar' || unit === 'bar') val = '80';
    else if (unit === '%') val = '50';
    else if (unit === 'mm' || unit === 'mm/s') val = '30';
    else if (unit === 's') val = '5';
    $el.val(val);
  });
  Swal.fire({ icon:'success', title:swalTitle('已填充','Filled'), html:swalHtml('测试数据已填入','Test data filled'), timer:1200, showConfirmButton:false });
}

function saveRecord() {
  if (!currentTask) { Swal.fire({ icon:'warning', title:swalTitle('提示','Info'), html:swalHtml('请先选择测试任务','Please select a test task first') }); return; }
  var recordData = {
    recordID: currentRecord ? currentRecord.recordID : null,
    testTaskID: currentTask.taskID,
    fields: collectFormFields(),
    templateRef: {
      display: currentTask.machineModel || '',
      processType: currentTask.processType || 'IM',
      cards: (currentCompose || []).map(function (c) { return { card: c.card, count: c.count }; })
    },
    operatorSAPID: sessionStorage.getItem('ID') || ''
  };
  Swal.fire(swalLoading('保存中...', { title: 'Saving...', html: '正在保存工艺参数' }));
  google.script.run
    .withSuccessHandler(function (result) {
      Swal.close();
      var r = JSON.parse(result || '{}');
      if (r.success) {
        if (r.recordID) currentRecord = { recordID: r.recordID, status: '草稿', fields: recordData.fields };
        $('#saveStatus').text('已保存 / Saved @ ' + new Date().toLocaleTimeString());
      } else { Swal.fire({ icon:'error', title:swalTitle('错误','Error'), html:swalHtml(r.message,'') }); }
    })
    .saveNPIProcessRecord(JSON.stringify(recordData));
}

function submitRecord() {
  if (!currentTask) { Swal.fire({ icon:'warning', title:swalTitle('提示','Info'), html:swalHtml('请先选择测试任务','Please select a test task first') }); return; }
  var emptyFields = [];
  $('.npi-field').each(function () {
    var el = $(this);
    if (el.closest('.barrel-disabled').length) return; // 禁用区块/卡实例/热流道不校验
    if (el.is('textarea')) return;
    var key = el.data('key') || '';
    var val = el.val().trim();
    if (!val) {
      var label = el.closest('.row, .col-12, .col-6').find('.form-label-sm').text().trim().replace(/<[^>]*>/g, '').substring(0, 30) || key;
      emptyFields.push(label || key);
    }
  });
  if (emptyFields.length > 0) {
    Swal.fire({ icon: 'warning', title: swalTitle('请填写必填项', 'Required fields missing'), html: swalHtml('以下 ' + emptyFields.length + ' 项不能为空：<br>' + emptyFields.slice(0, 10).join('<br>') + (emptyFields.length > 10 ? '<br>...等 ' + emptyFields.length + ' 项' : ''), emptyFields.length + ' fields required') });
    return;
  }
  var recordData = { recordID: currentRecord ? currentRecord.recordID : null, testTaskID: currentTask.taskID, fields: collectFormFields(), operatorSAPID: sessionStorage.getItem('ID') || '', processType: currentTask.processType || 'IM',
    templateRef: { display: currentTask.machineModel || '', processType: currentTask.processType || 'IM', cards: (currentCompose || []).map(function (c) { return { card: c.card, count: c.count }; }) } };
  Swal.fire({ title: swalTitle('确认提交','Confirm Submit'), html: swalHtml('提交后不可修改，确认提交？','Cannot modify after submit. Confirm?'), icon:'warning', showCancelButton:true, confirmButtonText:'确认 / Confirm', cancelButtonText:'取消 / Cancel' }).then(function (r) {
    if (!r.isConfirmed) return;
    Swal.fire(swalLoading('提交中...', { title: 'Submitting...', html: '正在保存并提交' }));
    google.script.run.withSuccessHandler(function (saveResult) {
      var sr = JSON.parse(saveResult || '{}');
      if (!sr.success) { Swal.close(); Swal.fire({ icon:'error', title:swalTitle('错误','Error'), html:swalHtml(sr.message,'') }); return; }
      var rid = sr.recordID || (currentRecord ? currentRecord.recordID : null);
      currentRecord = { recordID: rid, status: '草稿', fields: recordData.fields, cardNumber: sr.cardNumber };
      google.script.run.withSuccessHandler(function (subResult) {
        Swal.close(); var sub = JSON.parse(subResult || '{}');
        if (sub.success) {
          currentRecord.status = '已提交';
          $('#saveStatus').text('已提交 / Submitted');
          $('#btnSaveDraft, #btnSubmit').prop('disabled', true);
          $('#btnNewVersion').show();
          latestRecord = currentRecord;
          if (sub.cardNumber) {
            currentRecord.cardNumber = sub.cardNumber;
            $('#cardNumberDisplay').html('工艺卡<br><small>Card</small>: <span style="color:#0d47a1;">' + sub.cardNumber + '</span>');
            $('[data-key="productInfo_10"]').val(sub.cardNumber);
          }
          loadHistory(currentTask.taskID);
        }
        else Swal.fire({ icon:'error', title:swalTitle('错误','Error'), html:swalHtml(sub.message,'') });
      }).submitNPIProcessRecord(rid);
    }).saveNPIProcessRecord(JSON.stringify(recordData));
  });
}
function promoteToTBX() {
  if (!currentRecord || !currentRecord.recordID) {
    Swal.fire({ icon:'warning', title:swalTitle('提示','Info'), html:swalHtml('请先提交工艺参数记录','Please submit first') });
    return;
  }
  var mt = currentTask.processType || (currentRecord.processType) || 'IM';
  Swal.fire({
    title: swalTitle('确认转正','Confirm Promote'),
    html: swalHtml('将测试工艺卡 <b>' + (currentRecord.cardNumber || '?') + '</b> 转为正式工艺卡<br>并提交 PPMS 审核流程。', 'Promote test card to formal and submit to PPMS audit.'),
    icon: 'warning', showCancelButton: true, confirmButtonText: '确认 / Confirm', cancelButtonText: '取消 / Cancel'
  }).then(function (r2) {
    if (!r2.isConfirmed) return;
    Swal.fire(swalLoading('转正中...', { title: 'Promoting...', html: '正在创建正式工艺卡' }));
    google.script.run
      .withSuccessHandler(function (raw) {
        Swal.close(); var r = parseResponse(raw);
        if (r.success) {
          currentRecord.status = '已转正';
          $('#saveStatus').text('已转正 / Promoted - ' + r.processCardNumber);
          $('#cardNumberDisplay').html('工艺卡<br><small>Card</small>: <span style="color:#0d47a1;">' + r.processCardNumber + '</span>');
          $('#btnPromote').hide(); $('#btnSaveDraft, #btnSubmit').prop('disabled', true);
          Swal.fire({ icon:'success', title:swalTitle('转正成功','Promoted'), html:swalHtml('正式工艺卡：<br>' + r.processCardNumber, 'Formal card: ' + r.processCardNumber), timer: 5000, showConfirmButton: true });
        } else { showError(r.message || '转正失败', 'Failed'); }
      })
      .withFailureHandler(function (err) { Swal.close(); showError(err.message || String(err), 'Failed'); })
      .promoteNPItoTBX(currentRecord.recordID, mt, sessionStorage.getItem('ID') || '');
  });
}
