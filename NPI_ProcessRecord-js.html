const swalTitle = (cn, en) => `${cn}<span style="display:block;font-size:0.65em;color:#888;font-weight:400;line-height:1.3;margin-top:4px;">${en}</span>`;
const swalHtml = (cn, en) => `<div>${cn}<div style="font-size:0.85em;color:#888;margin-top:6px;line-height:1.4;">${en}</div></div>`;
const swalLoading = (cn, en) => {
  var start = Date.now();
  return {
    title: swalTitle(cn, en.title || en),
    html: swalHtml(cn, en.html || en) + '<div style="margin-top:8px;font-size:12px;color:#adb5bd;">⏱ <span class="swal-timer">0</span>s</div>',
    allowOutsideClick: false,
    showConfirmButton: false,
    didOpen: function () {
      Swal.showLoading();
      var el = document.querySelector('.swal-timer');
      if (el) {
        el._interval = setInterval(function () { el.textContent = Math.floor((Date.now() - start) / 1000); }, 1000);
      }
    },
    willClose: function () {
      var els = document.querySelectorAll('.swal-timer');
      els.forEach(function (el) { if (el._interval) clearInterval(el._interval); });

  };
};

// Build a flat index: key = "section_row_subcol" → position in 196-element array
function buildFieldIndex() {
  var pos = 0;
  TEMPLATE_SECTIONS.forEach(function (sec) {
    if (sec.subSections) {
      sec.subSections.forEach(function (sub) {
        (sub.rows || []).forEach(function (r) {
          if (r.subCols) {
            r.subCols.forEach(function (sc) {
              fieldKeyMap[sec.id + '_' + sub.id + '_' + r.row + '_' + sc] = pos++;
            });
          } else if (r.subRows) {
            r.subRows.forEach(function (sr) {
              fieldKeyMap[sec.id + '_' + sub.id + '_' + r.row + '_' + sr.row] = pos++;
            });
          } else {
            fieldKeyMap[sec.id + '_' + sub.id + '_' + r.row] = pos++;
          }
        });
      });
    } else if (sec.rows) {
      sec.rows.forEach(function (r) {
        if (r.subCols) {
          r.subCols.forEach(function (sc) {
            fieldKeyMap[sec.id + '_' + r.row + '_' + sc] = pos++;
          });
        } else if (r.subRows) {
          r.subRows.forEach(function (sr) {
            fieldKeyMap[sec.id + '_' + r.row + '_' + sr.row] = pos++;
          });
        } else {
          fieldKeyMap[sec.id + '_' + r.row] = pos++;
        }
      });
    }
  });
  // Add remaining free-text slots up to 196
  while (pos < 196) {
    fieldKeyMap['_free_' + (pos)] = pos;
    pos++;
  }
}

function renderAuxEquip() {
  var html = '<div id="auxEquipContainer">';
  // Add device dropdown + button
  html += '<div class="d-flex align-items-center gap-2 mb-2"><select id="auxEquipSelect" class="form-select form-select-sm" style="width:auto;">';
  html += '<option value="">-- 选择设备 / Select Device --</option>';
  EQUIPMENT_TYPES.forEach(function (eq) {
    html += '<option value="' + eq.id + '">' + eq.cn + ' / ' + eq.en + '</option>';
  });
  html += '</select><button class="btn btn-sm btn-outline-secondary" onclick="addEquipment()"><i class="bi bi-plus"></i> 添加 / Add</button></div>';
  // Active equipment cards
  html += '<div id="auxEquipList"></div>';
  html += '</div>';
  return html;
}

function addEquipment() {
  var sel = $('#auxEquipSelect').val();
  if (!sel) return;
  var eq = EQUIPMENT_TYPES.find(function (e) { return e.id === sel; });
  if (!eq) return;
  // Check if already added
  if (activeEquipment.some(function (a) { return a.typeId === sel; })) {
    Swal.fire({ icon:'warning', title:swalTitle('已添加','Already Added'), html:swalHtml(eq.cn + ' 已存在。', eq.en + ' already exists.'), timer:1500, showConfirmButton:false });
    return;
  }
  var fields = {};
  eq.fields.forEach(function (f) { fields[f.key] = ''; });
  activeEquipment.push({ typeId: sel, enabled: true, fields: fields });
  renderEquipCards();
}

function removeEquipment(idx) {
  activeEquipment.splice(idx, 1);
  renderEquipCards();
  rebuildFieldIndex();
}

function toggleEquipment(idx) {
  activeEquipment[idx].enabled = !activeEquipment[idx].enabled;
  var card = $('#equipCard_' + idx);
  if (activeEquipment[idx].enabled) {
    card.removeClass('barrel-disabled');
  } else {
    card.addClass('barrel-disabled');
    card.find('.npi-field').val('');
  }
}

    html += '<label class="barrel-toggle mb-0"><input type="checkbox" ' + (ae.enabled ? 'checked' : '') + ' onchange="toggleEquipment(' + idx + ')"><span class="toggle-switch"></span> <strong style="font-size:12px;">' + eq.cn + ' <small style="color:#888;">' + eq.en + '</small></strong></label>';
    html += '<button class="btn btn-sm btn-outline-danger" onclick="removeEquipment(' + idx + ')" title="移除 / Remove" style="font-size:10px;padding:1px 6px;">× 移除<br><small>Remove</small></button>';
    html += '</div>';
    html += '<div class="row g-1">';
    eq.fields.forEach(function (f) {
      html += '<div class="col-6 col-md-4 col-lg-3"><label class="form-label-sm">' + f.cn + '<br><small>' + f.en + '</small></label>';
      html += '<input type="' + (f.type || 'text') + '" class="form-control form-control-sm npi-field" data-key="auxEquip_' + idx + '_' + f.key + '"' + (f.type === 'number' ? ' step="any" min="0"' : '') + '>';
      html += '</div>';
    });
    html += '</div></div>';
  });
  $('#auxEquipList').html(html);
  rebuildFieldIndex();
}

function hotRunnerCount() {
  return $('#hotRunnerContainer').find('[data-key^="hotRunner_temp_"]').length;
}

function renderHotRunner(sec) {
  var n = sec.hotRunnerCount || 12;
  var maxColsPerRow = 12;
  var groups = Math.ceil(n / maxColsPerRow);

  var html = '<div id="hotRunnerContainer">';
  // Batch controls above all groups
  html += '<div class="d-flex align-items-center gap-2 flex-wrap mb-2">';
  html += '<input type="number" id="hotRunnerBatchCount" value="1" min="1" style="width:60px;" class="form-control form-control-sm">';
  html += '<span style="font-size:12px;color:#6c757d;">点位<br><small>Zones</small></span>';
  html += '<button class="btn btn-sm btn-outline-secondary" onclick="addHotRunnerCol()"><i class="bi bi-plus"></i> 增加<br><small>Add</small></button>';
  html += '<button class="btn btn-sm btn-outline-secondary" onclick="removeHotRunnerCol()"><i class="bi bi-dash"></i> 减少<br><small>Remove</small></button>';
  html += '</div>';

  for (var g = 0; g < groups; g++) {
    var start = g * maxColsPerRow + 1;
    var end = Math.min(start + maxColsPerRow - 1, n);

    html += '<div class="hot-runner-group" style="overflow-x:auto;margin-bottom:12px;">';
    html += '<table class="table table-sm table-bordered" style="font-size:12px;margin-bottom:0;">';
    // Header row: column numbers start..end
    html += '<thead><tr style="background:#f8f9fa;"><th style="width:80px;">序号<br><small>Seq</small></th>';
    for (var i = start; i <= end; i++) {
      html += '<th style="text-align:center;min-width:90px;">' + i + '</th>';
    }
    html += '</tr></thead><tbody>';
    // Position row
    html += '<tr><td style="font-weight:600;background:#f8f9fa;">位置<br><small>Position</small></td>';
    for (var i = start; i <= end; i++) {
      html += '<td><div class="input-group input-group-sm"><select class="form-select form-select-sm npi-field hr-pos-select" data-key="hotRunner_pos_' + i + '" onchange="updateHRPosColor(this)"><option value="">-- / Select --</option>';
      HOT_RUNNER_POSITIONS.forEach(function (p) {
        html += '<option value="' + p.v + '">' + p.t + '</option>';
      });
      html += '</select><button class="btn btn-outline-secondary btn-sm" onclick="copyHotRunnerPosRight(' + i + ',' + n + ')" title="复制到右侧所有列 / Copy to all columns to the right" type="button" style="font-size:10px;"><i class="bi bi-arrow-right"></i></button></div></td>';
    }
    html += '</tr>';
    // Temperature row
    html += '<tr><td style="font-weight:600;background:#f8f9fa;">温度<br><small>Temp (°C)</small></td>';
    for (var i = start; i <= end; i++) {
      html += '<td><input type="number" class="form-control form-control-sm npi-field" data-key="hotRunner_temp_' + i + '" step="any" placeholder="°C" style="width:70px;margin:0 auto;display:block;"></td>';
    }
    html += '</tr></tbody></table>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function reRenderHotRunner(newN) {
  // Save all current field values before re-rendering
  var saved = {};
  $('#hotRunnerContainer').find('.npi-field').each(function () {
    var key = $(this).data('key');
    if (key) saved[key] = $(this).val();
  });
  // Re-render with new count
  var sec = { hotRunner: true, hotRunnerCount: newN, hotRunnerMin: 1 };
  $('#hotRunnerContainer').replaceWith(renderHotRunner(sec));
  // Restore values that still exist
  for (var key in saved) {
    $('[data-key="' + key + '"]').val(saved[key]);
  }
  // Restore position colors
  $('.hr-pos-select').each(function () { updateHRPosColor(this); });
  // Sync template definition
  var hrSec = TEMPLATE_SECTIONS.find(function (s) { return s.id === 'hotRunner'; });
  if (hrSec) hrSec.hotRunnerCount = newN;
  rebuildFieldIndex();
}

function addHotRunnerCol() {
  var n = hotRunnerCount();
  var batch = parseInt($('#hotRunnerBatchCount').val()) || 1;
  if (batch <= 0) return;
  reRenderHotRunner(n + batch);
}

function updateHRPosColor(sel) {
  var val = sel.value;
  var colors = { '流道板':'hr-pos-manifold', '主灌嘴':'hr-pos-nozzle', '底板':'hr-pos-bottom', '手按位':'hr-pos-manual', '头胶':'hr-pos-front', '尾胶':'hr-pos-rear', '舌苔':'hr-pos-tongue', '其他':'hr-pos-other' };
  sel.className = sel.className.replace(/hr-pos-\w+/g, '').replace(/\s+/g,' ').trim();
  if (colors[val]) { sel.classList.add(colors[val]); }
}

function copyHotRunnerPosRight(fromIdx, totalN) {
  var sel = $('[data-key="hotRunner_pos_' + fromIdx + '"]');
  var val = sel.val();
  if (!val) return;
  for (var j = fromIdx + 1; j <= totalN; j++) {
    $('[data-key="hotRunner_pos_' + j + '"]').val(val).each(function () { updateHRPosColor(this); });
  }
}

function removeHotRunnerCol() {
  var n = hotRunnerCount();
  var batch = parseInt($('#hotRunnerBatchCount').val()) || 1;
  if (n - batch < 1) batch = n - 1;
  if (batch <= 0) return;
  reRenderHotRunner(n - batch);
}

function renderAccordion() {
  var html = '';
  TEMPLATE_SECTIONS.forEach(function (sec, idx) {
    var isFirst = idx === 0;
    html += '<div class="accordion-item">';
    html += '<h2 class="accordion-header">';
    html += '<button class="accordion-button' + (isFirst ? '' : ' collapsed') + '" type="button" data-bs-toggle="collapse" data-bs-target="#collapse_' + sec.id + '">' + sec.title + '</button>';
    html += '</h2>';
    html += '<div id="collapse_' + sec.id + '" class="accordion-collapse collapse' + (isFirst ? ' show' : '') + '" data-bs-parent="#paramAccordion">';
    html += '<div class="accordion-body">';
    html += renderSectionBody(sec);
    html += '</div></div></div>';
  });
  $('#paramAccordion').html(html);
}

function renderSectionBody(sec) {
  var html = '';
  if (sec.subSections) {
    var barrelClasses = { barrelA:'barrel-a', barrelB:'barrel-b', barrelC:'barrel-c', barrelD:'barrel-d' };
    sec.subSections.forEach(function (sub) {
      var bc = barrelClasses[sub.id] || '';
      var isBarrel = !!bc;
      html += '<div class="mb-3 ' + bc + (isBarrel ? ' barrel-disabled' : '') + '" id="section_' + sub.id + '">';
      if (isBarrel) {
        html += '<label class="barrel-toggle"><input type="checkbox" id="toggle_' + sub.id + '" onchange="toggleBarrel(\'' + sub.id + '\')"><span class="toggle-switch"></span> <strong style="font-size:12px;">' + sub.title + '</strong></label>';
      } else {
        html += '<strong style="font-size:12px;">' + sub.title + '</strong>';
      }
      html += '<div class="row g-2 mt-1">';
      (sub.rows || []).forEach(function (r) {
        html += renderFieldRow(sec.id + '_' + sub.id, r);
      });
      html += '</div></div>';
    });
  } else if (sec.auxEquip) {
    html += renderAuxEquip();
  } else if (sec.hotRunner) {
    html += '<div class="mb-3" id="section_hotRunner"><label class="barrel-toggle"><input type="checkbox" id="toggle_hotRunner" onchange="toggleHotRunner()"><span class="toggle-switch"></span> <strong style="font-size:12px;">启用热流道 / Enable Hot Runner</strong></label><div class="hot-runner-content barrel-disabled">';
    html += renderHotRunner(sec);
    html += '</div></div>';
  } else if (sec.rows) {
    html += '<div class="row g-2">';
    sec.rows.forEach(function (r) {
      html += renderFieldRow(sec.id, r);
    });
    html += '</div>';
  }
  return html;
}

function renderFieldRow(prefix, r) {
  var html = '';
  if (r.subCols) {
    var colType = r.type || 'text';
    var offset = r.offsetClass || '';
    var minSeg = r.minSeg || 1;
    var maxSeg = r.maxSeg || 12;
    var segPrefix = r.segPrefix || '';
    html += '<div class="col-12" id="row_' + prefix + '_' + r.row + '"><label class="form-label-sm">' + r.label + '</label><div class="row g-1 align-items-end' + (offset ? ' ' + offset : '') + '">';
    r.subCols.forEach(function (sc) {
      html += '<div class="col-4 col-md-2 seg-cell"><input type="' + colType + '" class="form-control form-control-sm npi-field" data-key="' + prefix + '_' + r.row + '_' + sc + '" placeholder="' + sc + '"' + (colType === 'number' ? ' step="any"' : '') + '></div>';
    });
    html += '<div class="col-auto"><button class="btn btn-sm btn-outline-secondary seg-btn" onclick="addSegment(\'' + prefix + '\',' + r.row + ',' + minSeg + ',' + maxSeg + ',\'' + colType + '\',\'' + segPrefix + '\')" title="增加一段 / Add"><i class="bi bi-plus"></i></button></div>';
    html += '<div class="col-auto"><button class="btn btn-sm btn-outline-secondary seg-btn" onclick="removeSegment(\'' + prefix + '\',' + r.row + ',' + minSeg + ',\'' + colType + '\')" title="减少一段 / Remove"><i class="bi bi-dash"></i></button></div>';
    html += '</div></div>';
  } else if (r.subRows) {
    html += '<div class="col-12"><label class="form-label-sm">' + r.label + '</label><div class="row g-1">';
    r.subRows.forEach(function (sr) {
      html += '<div class="col-3 col-md-2"><input type="text" class="form-control form-control-sm npi-field" data-key="' + prefix + '_' + r.row + '_' + sr.row + '" placeholder="' + sr.label + '"></div>';
    });
    html += '</div></div>';
  } else if (r.isTextarea) {
    html += '<div class="col-12"><label class="form-label-sm">' + r.label + '</label>';
    html += '<textarea class="form-control form-control-sm npi-field" data-key="' + prefix + '_' + r.row + '" rows="3"></textarea></div>';
  } else {
    var inputType = r.type || 'text';
    html += '<div class="col-6 col-md-4 col-lg-3">';
    html += '<label class="form-label-sm">' + r.label + '</label>';
    html += '<input type="' + inputType + '" class="form-control form-control-sm npi-field" data-key="' + prefix + '_' + r.row + '"' + (inputType === 'number' ? ' step="any" min="0"' : '') + (r.readonly ? ' readonly' : '') + '>';
    html += '</div>';
  }
  return html;
}

function loadTaskList(callback) {

function selectTask(taskID) {
  currentTask = allTasks.find(function (t) { return t.taskID === taskID; });
  if (!currentTask) return;
  var info = [];
  if (currentTask.productName) info.push('<span class="task-info-item">产品<br><small>Product</small>: ' + currentTask.productName + '</span>');
  if (currentTask.moldNo) info.push('<span class="task-info-item">模具<br><small>Mold</small>: ' + currentTask.moldNo + '</span>');
  if (currentTask.machineNo) info.push('<span class="task-info-item">机台<br><small>Machine</small>: ' + currentTask.machineNo + '</span>');
  if (currentTask.status) info.push('<span class="task-info-item">状态<br><small>Status</small>: ' + currentTask.status + '</span>');
  info.push('<span class="task-info-item" id="cardNumberDisplay" style="background:#e8f5e9;font-weight:600;">工艺卡<br><small>Card</small>: <span style="color:#999;">无工艺卡<br><small>No Card</small></span></span>');
  $('#taskInfo').html(info.join(' '));
  $('#paramFormCard, #historyCard').show();

  google.script.run
    .withSuccessHandler(function (result) {
      var r = JSON.parse(result || '{}');
      currentRecord = r.success ? r.data : null;
      if (currentRecord) {
        fillFormFields(currentRecord.fields);
        var cardNum = currentRecord.cardNumber || '';
        if (cardNum) {
          $('#cardNumberDisplay').html('工艺卡<br><small>Card</small>: <span style="color:#0d6832;">' + cardNum + '</span>');
          $('[data-key="productInfo_10"]').val(cardNum);
        }
        var submitted = currentRecord.status === '已提交';
        var promoted = currentRecord.status === '已转正';
        $('#btnSaveDraft, #btnSubmit').prop('disabled', submitted || promoted);
        $('#btnPromote').toggle(submitted && !promoted);
        $('#saveStatus').text(promoted ? '已转正 / Promoted' : (submitted ? '已提交 / Submitted' : '草稿 / Draft'));
      } else {
        clearFormFields();
        $('#btnSaveDraft, #btnSubmit').prop('disabled', false);
        $('#btnPromote').hide();
        $('#saveStatus').text('新记录 / New Record');
        // Now fetch and fill card number
        google.script.run
          .withSuccessHandler(function (raw2) {
            var r2 = parseResponse(raw2);
            if (r2.success && r2.cardNumber && !r2.isExisting) {
              $('[data-key="productInfo_10"]').val(r2.cardNumber);
            } else if (!r2.success) {
              console.log('getSuggestedCardNumber failed: ' + (r2.message || ''));
            }
          })
          .withFailureHandler(function (err) {
            console.log('getSuggestedCardNumber error: ' + (err.message || String(err)));
          })
          .getSuggestedCardNumber(taskID);
      }
      loadHistory(taskID);
    })
    .loadNPIProcessRecordData(taskID);
}

function fillFormFields(fields) {
  $('.npi-field').each(function () {
    var key = $(this).data('key');
    var pos = fieldKeyMap[key];
    $(this).val(pos !== undefined && fields && fields[pos] ? fields[pos] : '');
  });
}

function addSegment(prefix, row, minSeg, maxSeg, colType, segPrefix) {
  var rowId = 'row_' + prefix + '_' + row;
  var rowEl = $('#' + rowId + ' .row');
  var segCount = rowEl.find('.seg-cell').length;
  if (segCount >= maxSeg) return;
  var segNum = segCount + 1;
  var segLabel = segPrefix + segNum;
  var btnCol = rowEl.find('.col-auto').first();
  var newCell = $('<div class="col-4 col-md-2 seg-cell"><input type="' + colType + '" class="form-control form-control-sm npi-field" data-key="' + prefix + '_' + row + '_' + segLabel + '" placeholder="' + segLabel + '"' + (colType === 'number' ? ' step="any"' : '') + '></div>');
  newCell.insertBefore(btnCol);
  rebuildFieldIndex();
}

function removeSegment(prefix, row, minSeg, colType) {
  var rowId = 'row_' + prefix + '_' + row;
  var cells = $('#' + rowId + ' .seg-cell');
  if (cells.length <= minSeg) return;
  cells.last().remove();
  rebuildFieldIndex();
}

function toggleBarrel(barrelId) {
  barrelEnabled[barrelId] = !barrelEnabled[barrelId];
  var section = $('#section_' + barrelId);
  if (barrelEnabled[barrelId]) {
    section.removeClass('barrel-disabled');
  } else {
    section.addClass('barrel-disabled');
    section.find('.npi-field').val('');
  }
}

function toggleHotRunner() {
  hotRunnerEnabled = !hotRunnerEnabled;
  var content = $('#section_hotRunner .hot-runner-content');
  if (hotRunnerEnabled) {
    content.removeClass('barrel-disabled');
  } else {
    content.addClass('barrel-disabled');
    content.find('.npi-field').val('');
  }
}

function rebuildFieldIndex() {
  fieldKeyMap = {};
  var pos = 0;
  // Walk all npi-fields in DOM order and assign positions
  $('.npi-field').each(function () {
    var key = $(this).data('key');
    if (key) fieldKeyMap[key] = pos++;
  });
  // Pad to 196
  while (pos < 196) {
    fieldKeyMap['_free_' + pos] = pos;
    pos++;
  }
}

function clearFormFields() { $('.npi-field').val(''); }

function collectFormFields() {
  var fields = new Array(196).fill('');
  $('.npi-field').each(function () {
    var key = $(this).data('key');
    var pos = fieldKeyMap[key];
    if (pos !== undefined) fields[pos] = $(this).val() || '';
  });
  return fields;
}

function clearForm() {
  currentTask = null; currentRecord = null;
  $('#taskInfo').html(''); $('#paramFormCard, #historyCard').hide(); clearFormFields();
  // Reset barrel toggles
  ['barrelA','barrelB','barrelC','barrelD'].forEach(function (id) {
    barrelEnabled[id] = false;
    $('#toggle_' + id).prop('checked', false);
    $('#section_' + id).addClass('barrel-disabled');
  });
  // Reset hot runner toggle
  hotRunnerEnabled = false;
  $('#toggle_hotRunner').prop('checked', false);
  $('#section_hotRunner .hot-runner-content').addClass('barrel-disabled');
}

function createTask() {
  var taskData = {
    source: $('#newSource').val(), productName: $('#newProductName').val().trim(),
    moldNo: $('#newMoldNo').val().trim(), machineNo: $('#newMachineNo').val().trim(),
    material: $('#newMaterial').val().trim(), planDate: $('#newPlanDate').val(),
    processType: $('#newProcessType').val() || 'IM',
    remark: $('#newRemark').val().trim()
  };
  // 必填验证（除备注外）
  var missing = [];
  if (!taskData.productName) missing.push('产品名称 / Product Name');
  if (!taskData.moldNo) missing.push('模具编号 / Mold No.');
  if (!taskData.machineNo) missing.push('机台编号 / Machine No.');
  if (!taskData.material) missing.push('物料 / Material');
  if (!taskData.planDate) missing.push('计划日期 / Plan Date');
  if (missing.length > 0) {
    Swal.fire({ icon: 'warning', title: swalTitle('请填写必填项','Required fields missing'), html: swalHtml(missing.join('<br>'), missing.join('<br>')) });
    return;
  }
  Swal.fire({
    title: swalTitle('确认创建', 'Confirm Create'),
    html: swalHtml('确认创建此测试任务？', 'Confirm to create this test task?'),
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: '确认 / Confirm',
    cancelButtonText: '取消 / Cancel'
  }).then(function (r) {
    if (!r.isConfirmed) return;
    Swal.fire(swalLoading('创建中...', { title: 'Creating...', html: '正在创建测试任务' }));
    google.script.run
      .withSuccessHandler(function (result) {
        Swal.close();
        var r2 = JSON.parse(result || '{}');
        if (r2.success) {
          $('#newTaskModal').modal('hide');
          Swal.fire({ icon:'success', title:swalTitle('创建成功','Task Created'), html:swalHtml('任务 ' + r2.taskID + ' 已创建', 'Task ' + r2.taskID + ' created'), timer:3000, showConfirmButton:false });
          loadTaskList(function () { $('#taskSelect').val(r2.taskID); selectTask(r2.taskID); });
        } else {
          Swal.fire({ icon:'error', title:swalTitle('错误','Error'), html:swalHtml(r2.message,'') });
        }
      })
      .createNPITestTask(JSON.stringify(taskData), sessionStorage.getItem('ID') || '');
  });
}

function saveRecord() {
  if (!currentTask) { Swal.fire({ icon:'warning', title:swalTitle('提示','Info'), html:swalHtml('请先选择测试任务','Please select a test task first') }); return; }
  var recordData = {
    recordID: currentRecord ? currentRecord.recordID : null,
    testTaskID: currentTask.taskID,
    fields: collectFormFields(),
    operatorSAPID: sessionStorage.getItem('ID') || ''
  };
  Swal.fire(swalLoading('保存中...', { title: 'Saving...', html: '正在保存工艺参数' }));
  google.script.run
    .withSuccessHandler(function (result) {
      Swal.close();
      var r = JSON.parse(result || '{}');
      if (r.success) {
        if (r.recordID) currentRecord = { recordID: r.recordID, status: '草稿', fields: recordData.fields };
        $('#saveStatus').text('已保存 / Saved @ ' + new Date().toLocaleTimeString());
        loadHistory(currentTask.taskID);
      } else { Swal.fire({ icon:'error', title:swalTitle('错误','Error'), html:swalHtml(r.message,'') }); }
    })
    .saveNPIProcessRecord(JSON.stringify(recordData));
}

function submitRecord() {
  if (!currentRecord || !currentRecord.recordID) { Swal.fire({ icon:'warning', title:swalTitle('提示','Info'), html:swalHtml('请先保存草稿','Please save draft first') }); return; }
  Swal.fire({
    title: swalTitle('确认提交','Confirm Submit'), html: swalHtml('提交后不可修改，确认提交？','Cannot modify after submit. Confirm?'),
    icon:'warning', showCancelButton:true, confirmButtonText:'确认 / Confirm', cancelButtonText:'取消 / Cancel'
  }).then(function (r) {
    if (!r.isConfirmed) return;
    Swal.fire(swalLoading('提交中...', { title: 'Submitting...', html: '正在提交' }));
    google.script.run
      .withSuccessHandler(function (result) {
        Swal.close();
        var res = JSON.parse(result || '{}');
        if (res.success) {
          $('#saveStatus').text('已提交 / Submitted');
          $('#btnSaveDraft, #btnSubmit').prop('disabled', true);
          $('#btnPromote').show();
          loadHistory(currentTask.taskID);

      })
      .submitNPIProcessRecord(currentRecord.recordID);
  });
}

function promoteToTBX() {
  if (!currentRecord || !currentRecord.recordID) {
    Swal.fire({ icon:'warning', title:swalTitle('提示','Info'), html:swalHtml('请先提交工艺参数记录','Please submit first') });
    return;
  }
  var mt = currentTask.processType || (currentRecord.processType) || 'IM';
  Swal.fire({
    title: swalTitle('确认转正','Confirm Promote'),
    html: swalHtml('将测试工艺卡 <b>' + (currentRecord.cardNumber || '?') + '</b> 转为正式工艺卡<br>并提交 PPMS 审核流程。', 'Promote test card to formal and submit to PPMS audit.'),
    icon: 'warning', showCancelButton: true, confirmButtonText: '确认 / Confirm', cancelButtonText: '取消 / Cancel'
  }).then(function (r2) {
    if (!r2.isConfirmed) return;
    Swal.fire(swalLoading('转正中...', { title: 'Promoting...', html: '正在创建正式工艺卡' }));
    google.script.run
      .withSuccessHandler(function (raw) {
        Swal.close(); var r = parseResponse(raw);
        if (r.success) {
          currentRecord.status = '已转正';
          $('#saveStatus').text('已转正 / Promoted - ' + r.processCardNumber);
          $('#cardNumberDisplay').html('工艺卡<br><small>Card</small>: <span style="color:#0d47a1;">' + r.processCardNumber + '</span>');
          $('#btnPromote').hide(); $('#btnSaveDraft, #btnSubmit').prop('disabled', true);
          Swal.fire({ icon:'success', title:swalTitle('转正成功','Promoted'), html:swalHtml('正式工艺卡：<br>' + r.processCardNumber, 'Formal card: ' + r.processCardNumber), timer: 5000, showConfirmButton: true });
          loadHistory(currentTask.taskID);
        } else { showError(r.message || '转正失败', 'Failed'); }
      })
      .withFailureHandler(function (err) { Swal.close(); showError(err.message || String(err), 'Failed'); })
      .promoteNPItoTBX(currentRecord.recordID, mt, sessionStorage.getItem('ID') || '');
  });
}

function loadHistory(testTaskID) {
  google.script.run
    .withSuccessHandler(function (result) {
      var r = JSON.parse(result || '{}');
      var versions = r.success ? r.data : [];
      var html = '';
      versions.forEach(function (v) {
        var isActive = currentRecord && currentRecord.recordID === v.recordID;
        var statusBadge = v.status === '已提交'
          ? '<span style="color:#198754;font-weight:700;">已提交 / Submitted</span>'
          : '<span style="color:#fd7e14;">草稿 / Draft</span>';
        var latestBadge = v.isLatest ? ' <span class="badge bg-primary" style="font-size:9px;">最新 Latest</span>' : '';
        html += '<div class="version-list-item' + (isActive ? ' active' : '') + '">';
        html += '<span>' + v.recordID + latestBadge + '</span>';
        html += '<span>' + statusBadge + '</span>';
        html += '<span style="color:#adb5bd;font-size:11px;">' + (v.updatedAt || '') + '</span>';
        html += '</div>';
      });
      $('#historyList').html(html || '<div style="color:#adb5bd;font-size:12px;padding:12px;">暂无记录 / No records</div>');
    })
    .loadNPIProcessRecordHistory(testTaskID);
}
</script>
